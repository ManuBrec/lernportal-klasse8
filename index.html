<!doctype html><html lang="de"><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Lernportal Klasse 8</title>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Karla:ital,wght@0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<!-- "Zum Home-Bildschirm hinzufügen" (iPad/iPhone) + allgemeines Web-App-Manifest: macht aus dem Link ein App-Symbol -->
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png" sizes="192x192">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Lernportal">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#3454D1">
<style>
  :root{
    --bg: #EEF3F6;
    --bg-soft: #E4EBEF;
    --surface: #FFFFFF;
    --surface-2: #F5F8FA;
    --border: #D3DEE4;
    --ink: #1B2A33;
    --ink-soft: #4C616C;
    --ink-faint: #7C909A;
    --accent: #3454D1;
    --accent-ink: #FFFFFF;
    --accent-soft: #E6EAFB;
    --warm: #C97A2B;
    --warm-soft: #FBEBD9;
    --success: #237A4B;
    --success-soft: #DFF3E6;
    --danger: #B8402D;
    --danger-soft: #FBE4DF;
    --mark: #C2410C;
    --mark-soft: #FDE3D3;
    --radius-lg: 20px;
    --radius-md: 14px;
    --radius-sm: 9px;
    --shadow: 0 1px 2px rgba(27,42,51,0.06), 0 8px 24px -12px rgba(27,42,51,0.18);
    --font-display: "Baloo 2", "Segoe UI Rounded", system-ui, sans-serif;
    --font-body: "Karla", "Segoe UI", system-ui, sans-serif;
    --font-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg: #101820;
      --bg-soft: #0B1218;
      --surface: #182129;
      --surface-2: #1D2830;
      --border: #2B3944;
      --ink: #E9EEF1;
      --ink-soft: #AEBFC8;
      --ink-faint: #7E939D;
      --accent: #7C93F0;
      --accent-ink: #101820;
      --accent-soft: #26304A;
      --warm: #E3A45E;
      --warm-soft: #3A2C19;
      --success: #5FC48A;
      --success-soft: #1B3327;
      --danger: #E68A78;
      --danger-soft: #3B231F;
      --mark: #FF9D5C;
      --mark-soft: #3A2013;
      --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 28px -12px rgba(0,0,0,0.55);
    }
  }
  :root[data-theme="dark"]{
    --bg: #101820;
    --bg-soft: #0B1218;
    --surface: #182129;
    --surface-2: #1D2830;
    --border: #2B3944;
    --ink: #E9EEF1;
    --ink-soft: #AEBFC8;
    --ink-faint: #7E939D;
    --accent: #7C93F0;
    --accent-ink: #101820;
    --accent-soft: #26304A;
    --warm: #E3A45E;
    --warm-soft: #3A2C19;
    --success: #5FC48A;
    --success-soft: #1B3327;
    --danger: #E68A78;
    --danger-soft: #3B231F;
    --mark: #FF9D5C;
    --mark-soft: #3A2013;
    --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 28px -12px rgba(0,0,0,0.55);
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:var(--font-body);
    font-size:16px;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  body::before{
    content:"";
    position:fixed; inset:0; z-index:-1;
    background:
      linear-gradient(var(--bg-soft) 1px, transparent 1px) 0 0/100% 42px,
      var(--bg);
    opacity:0.5;
  }
  h1,h2,h3{font-family:var(--font-display); font-weight:700; text-wrap:balance; margin:0;}
  a{color:var(--accent);}
  button{font-family:inherit;}
  .num{font-family:var(--font-mono); font-variant-numeric:tabular-nums;}

  .shell{max-width:760px; margin:0 auto; padding:0 20px 64px;}
  .topbar{
    display:flex; align-items:center; gap:12px; flex-wrap:wrap;
    padding:18px 20px; max-width:760px; margin:0 auto;
    position:sticky; top:0; z-index:5;
    background:color-mix(in srgb, var(--bg) 88%, transparent);
    backdrop-filter:blur(8px);
    border-bottom:1px solid var(--border);
  }
  .brand{display:flex; align-items:center; gap:10px; text-decoration:none; color:var(--ink);}
  .brand-mark{
    width:36px; height:36px; border-radius:10px; flex:none;
    background:var(--accent); color:var(--accent-ink);
    display:flex; align-items:center; justify-content:center;
    font-family:var(--font-display); font-weight:800; font-size:18px;
  }
  .brand-name{font-family:var(--font-display); font-weight:700; font-size:17px;}
  .crumbs{margin-left:auto; display:flex; align-items:center; flex-wrap:wrap; gap:6px 8px; font-size:14px; color:var(--ink-soft);}
  .crumbs a{color:var(--ink-soft); text-decoration:none;}
  .crumbs a:hover{color:var(--accent);}
  .teacher-link{
    display:inline-flex; align-items:center; gap:6px; text-decoration:none;
    background:var(--surface-2); color:var(--ink-soft); border:1px solid var(--border);
    border-radius:999px; padding:6px 12px; font-size:13px; font-weight:700; flex:none;
  }
  .teacher-link[hidden]{display:none;}
  .teacher-link:hover{color:var(--accent); border-color:var(--accent);}
  .backlink{
    display:inline-flex; align-items:center; gap:6px;
    color:var(--ink-soft); text-decoration:none; font-size:14px; font-weight:600;
    margin-bottom:18px;
  }
  .backlink:hover{color:var(--accent);}

  .hero{padding:36px 0 8px;}
  .eyebrow{
    display:inline-flex; align-items:center; gap:8px;
    font-size:12.5px; font-weight:700; letter-spacing:.06em; text-transform:uppercase;
    color:var(--accent); background:var(--accent-soft);
    padding:5px 12px; border-radius:999px; margin-bottom:14px;
  }
  .hero h1{font-size:clamp(28px,5vw,38px); margin-bottom:10px;}
  .hero p{color:var(--ink-soft); font-size:16.5px; max-width:52ch;}

  .grid{display:grid; gap:14px; margin-top:22px;}
  .card{
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-lg);
    box-shadow:var(--shadow);
  }
  .subject-card{
    display:flex; align-items:center; gap:16px; padding:20px; text-decoration:none; color:var(--ink);
    transition:transform .12s ease, border-color .12s ease;
  }
  .subject-card.active:hover{transform:translateY(-2px); border-color:var(--accent);}
  .subject-card.disabled{opacity:.55; cursor:default;}
  .subject-icon{
    width:52px; height:52px; border-radius:14px; flex:none;
    display:flex; align-items:center; justify-content:center; font-size:24px;
    background:var(--accent-soft);
  }
  .subject-card.disabled .subject-icon{background:var(--surface-2);}
  .subject-title{font-family:var(--font-display); font-weight:700; font-size:18px; margin-bottom:2px;}
  .subject-sub{font-size:14px; color:var(--ink-soft);}
  .pill{
    margin-left:auto; font-size:12px; font-weight:700; padding:4px 10px; border-radius:999px;
    white-space:nowrap;
  }
  .pill-soon{background:var(--surface-2); color:var(--ink-faint);}

  .chapter-list{display:flex; flex-direction:column; gap:10px; margin-top:22px;}
  .chapter-row{
    display:flex; align-items:center; gap:16px; padding:16px 18px;
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-md);
    text-decoration:none; color:var(--ink);
  }
  .chapter-row.linkable:hover{border-color:var(--accent);}
  .chapter-nr{
    font-family:var(--font-mono); font-weight:600; font-size:13px; color:var(--ink-faint);
    width:26px; flex:none;
  }
  .chapter-main{flex:1; min-width:0;}
  .chapter-title{font-weight:700; font-size:15.5px;}
  .chapter-meta{font-size:13px; color:var(--ink-faint); margin-top:2px;}
  .status{
    flex:none; font-size:12px; font-weight:700; padding:5px 11px; border-radius:999px;
    display:inline-flex; align-items:center; gap:6px;
  }
  .status::before{content:""; width:7px; height:7px; border-radius:50%;}
  .status-aktuell{background:var(--warm-soft); color:var(--warm);}
  .status-aktuell::before{background:var(--warm);}
  .status-geplant{background:var(--surface-2); color:var(--ink-faint);}
  .status-geplant::before{background:var(--ink-faint);}
  .status-fertig{background:var(--success-soft); color:var(--success);}
  .status-fertig::before{background:var(--success);}

  .section-label{
    font-size:12.5px; font-weight:700; letter-spacing:.05em; text-transform:uppercase;
    color:var(--ink-faint); margin:30px 0 12px;
  }
  .topic-group{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-md); overflow:hidden;}
  .topic-row{
    display:flex; align-items:center; gap:12px; padding:13px 16px;
    border-bottom:1px solid var(--border); font-size:14.5px;
  }
  .topic-row:last-child{border-bottom:none;}
  .topic-tag{
    font-family:var(--font-mono); font-size:10.5px; font-weight:600; letter-spacing:.03em;
    padding:3px 7px; border-radius:6px; flex:none; text-transform:uppercase;
  }
  .tag-lernen{background:var(--accent-soft); color:var(--accent);}
  .tag-strategie{background:var(--warm-soft); color:var(--warm);}
  .tag-werkzeug{background:var(--surface-2); color:var(--ink-soft);}
  .tag-abschluss{background:var(--success-soft); color:var(--success);}
  .tag-loesung{background:var(--success-soft); color:var(--success);}
  .topic-name{flex:1;}
  .topic-page{font-family:var(--font-mono); font-size:12.5px; color:var(--ink-faint);}
  .practice-btn{
    flex:none; font-size:13px; font-weight:700; color:var(--accent-ink); background:var(--accent);
    border:none; border-radius:999px; padding:7px 14px; text-decoration:none; cursor:pointer;
  }
  .topic-progress{display:flex; align-items:center; gap:7px; flex:none;}
  .topic-progress-bar{width:52px; height:6px; border-radius:999px; background:var(--surface-2); overflow:hidden; flex:none;}
  .topic-progress-fill{display:block; height:100%; border-radius:999px; transition:width .2s ease;}
  .topic-progress-fill.green{background:var(--success);}
  .topic-progress-fill.orange{background:var(--warm);}
  .topic-progress-pct{font-size:12px; color:var(--ink-faint); width:32px; text-align:right; flex:none;}

  .callout{
    margin-top:26px; padding:16px 18px; border-radius:var(--radius-md);
    background:var(--accent-soft); border:1px solid color-mix(in srgb, var(--accent) 25%, transparent);
    font-size:14.5px; color:var(--ink);
  }
  .callout strong{color:var(--accent);}

  /* Exercise */
  .progress-track{height:6px; border-radius:999px; background:var(--surface-2); overflow:hidden; margin:20px 0 26px;}
  .progress-fill{height:100%; background:var(--accent); border-radius:999px; transition:width .25s ease;}
  .qnav{display:flex; flex-wrap:wrap; gap:6px; margin:18px 0 6px;}
  .qnav-btn{
    width:30px; height:30px; border-radius:50%; border:1.5px solid var(--border); background:var(--surface-2);
    color:var(--ink-soft); font-family:var(--font-mono); font-size:12.5px; font-weight:700; cursor:pointer; padding:0;
  }
  .qnav-btn:hover{border-color:var(--accent);}
  .qnav-btn.current{border-color:var(--accent); color:var(--accent); box-shadow:0 0 0 2px var(--accent-soft);}
  .qnav-btn.correct{background:var(--success-soft); border-color:var(--success); color:var(--success);}
  .qnav-btn.skipped{background:var(--danger-soft); border-color:var(--danger); color:var(--danger);}
  .qnav-hint{font-size:12.5px; color:var(--ink-faint); margin:0 0 4px;}
  .qcard{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-lg); padding:26px; box-shadow:var(--shadow);}
  .qmeta-row{display:flex; align-items:center; gap:9px; margin-bottom:10px;}
  .qmeta-row .qmeta{margin-bottom:0;}
  .strategy-badge{
    flex:none; width:26px; height:26px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    color:#fff; font-weight:800; font-size:11px; letter-spacing:0; box-shadow:0 1px 2px rgba(0,0,0,.18);
  }
  .strategy-badge .icon-glyph{width:16px; height:16px;}
  .strategy-badge .icon-glyph svg{width:16px; height:16px;}
  .strategy-badge .icon-glyph{font-size:13px;}
  .big-badge-row{display:flex; justify-content:center; margin:2px 0 18px;}
  .strategy-badge-big{width:68px; height:68px;}
  .strategy-badge-big .icon-glyph{width:40px; height:40px;}
  .strategy-badge-big .icon-glyph svg{width:40px; height:40px;}
  .strategy-badge-big .icon-glyph{font-size:30px;}
  /* Symbol (Blitz/Welle/Pfeil/M/Aa) liegt direkt, in Weiß, auf dem farbigen Strategie-Kreis/Feld.
     Die konkrete Größe kommt von den Regeln oben/unten je nach Kontext (kleines Badge, großes
     Badge, Zuordnen-Chip, Kreis-Sortieren). */
  .icon-glyph{
    display:flex; align-items:center; justify-content:center; color:#fff; font-weight:800;
    line-height:1; flex:none;
  }
  .qmeta{font-size:12.5px; font-weight:700; color:var(--ink-faint); letter-spacing:.04em; text-transform:uppercase; margin-bottom:10px;}
  .qtext{font-size:19px; font-weight:600; margin-bottom:20px; text-wrap:balance;}
  .qtext b{color:var(--mark); background:var(--mark-soft); font-weight:800; border-radius:4px; padding:0 3px;}
  .options{display:grid; gap:10px;}
  .option{
    text-align:left; padding:14px 16px; border-radius:var(--radius-md);
    border:1.5px solid var(--border); background:var(--surface-2); color:var(--ink);
    font-size:15.5px; font-weight:600; cursor:pointer; font-family:inherit;
  }
  .option:hover{border-color:var(--accent);}
  .option:focus-visible{outline:3px solid var(--accent); outline-offset:2px;}
  .option.correct{background:var(--success-soft); border-color:var(--success); color:var(--success);}
  .option.wrong{background:var(--danger-soft); border-color:var(--danger); color:var(--danger);}
  .option.disabled{cursor:default;}
  .feedback{margin-top:18px; padding:14px 16px; border-radius:var(--radius-md); font-size:14.5px; display:none;}
  .feedback.show{display:block;}
  .feedback.correct{background:var(--success-soft); color:var(--success);}
  .feedback.wrong{background:var(--danger-soft); color:var(--danger);}
  .qactions{display:flex; justify-content:flex-end; margin-top:20px;}
  .next-btn{
    background:var(--accent); color:var(--accent-ink); border:none; border-radius:999px;
    padding:11px 22px; font-weight:700; font-size:14.5px; cursor:pointer; display:none;
  }
  .next-btn.show{display:inline-flex;}
  .shape-block{display:flex; justify-content:center; margin-bottom:20px;}
  .shape-block svg{max-width:160px; height:auto;}
  .qimage-block{display:flex; justify-content:center; margin-bottom:20px;}
  .qimage-block img{max-width:100%; max-height:300px; width:auto; height:auto; border-radius:var(--radius-md); box-shadow:var(--shadow); background:#fff; display:block;}
  .chart-block{display:flex; align-items:center; gap:20px; flex-wrap:wrap; margin-bottom:20px;}
  .chart-block svg{flex:none;}
  .legend{display:flex; flex-direction:column; gap:6px;}
  .legend-caption{font-size:12.5px; color:var(--ink-faint); margin-bottom:4px; max-width:24ch;}
  .legend-row{display:flex; align-items:center; gap:8px; font-size:14.5px;}
  .legend-dot{width:11px; height:11px; border-radius:3px; flex:none; border:1px solid rgba(0,0,0,.15);}
  .legend-pct{margin-left:auto; color:var(--ink-soft); padding-left:14px;}
  .legend-icon{width:18px; text-align:center; flex:none; font-size:15px;}
  .legend-block{margin-bottom:20px;}
  .numeric-row{display:flex; gap:10px; flex-wrap:wrap;}
  .numeric-row.correct .numeric-input{border-color:var(--success); background:var(--success-soft); color:var(--success);}
  .numeric-row.wrong .numeric-input{border-color:var(--danger); background:var(--danger-soft); color:var(--danger);}
  .numeric-input{
    flex:1; min-width:140px; padding:13px 16px; border-radius:var(--radius-md);
    border:1.5px solid var(--border); background:var(--surface-2); color:var(--ink);
    font-size:16px; font-family:var(--font-mono);
  }
  .numeric-input:focus-visible{outline:3px solid var(--accent); outline-offset:1px;}
  .check-btn{
    background:var(--accent); color:var(--accent-ink); border:none; border-radius:999px;
    padding:12px 22px; font-weight:700; font-size:14.5px; cursor:pointer;
  }
  .check-btn:disabled{opacity:.6; cursor:default;}
  .shade-grid{
    display:grid; gap:3px; max-width:320px; aspect-ratio:1; margin:0 auto 14px;
    touch-action:none; user-select:none; -webkit-user-select:none;
  }
  .shade-cell{
    aspect-ratio:1; border-radius:3px; border:1px solid var(--border); background:var(--surface-2);
    padding:0; cursor:pointer; touch-action:none;
  }
  .shade-cell.on{background:var(--accent); border-color:var(--accent);}
  .shade-cell.target{box-shadow:inset 0 0 0 2px var(--success);}
  .shade-count{text-align:center; font-size:14px; color:var(--ink-soft); margin-bottom:6px;}
  .gap-sentence{
    font-size:17px; line-height:2.3; padding:18px 16px; border-radius:var(--radius-md);
    background:var(--surface-2); margin-bottom:10px;
  }
  .gap-word{white-space:nowrap;}
  .gap-slot{
    display:inline-flex; align-items:center; justify-content:center; width:18px; height:26px;
    margin:0 1px; border:none; background:transparent; cursor:pointer; padding:0; vertical-align:middle;
    border-bottom:2px dashed var(--ink-faint);
  }
  .gap-slot .gap-comma{color:transparent; font-weight:800; font-size:19px;}
  .gap-slot.active{border-bottom:none;}
  .gap-slot.active .gap-comma{color:var(--accent);}
  .gap-slot.target:not(.active){border-bottom:2px dashed var(--success);}
  .gap-slot.target.active .gap-comma{color:var(--success);}
  .gap-slot:disabled{cursor:default;}
  .gap-hint{font-size:13px; color:var(--ink-faint); margin:0 0 12px;}

  /* Karten-/Bild-Zuordnung per Drag & Drop (Bundesländer, Nachbarländer, Bauernhof) */
  .mm-board{display:grid; gap:6px; margin:4px 0 16px;}
  /* Buchstabengitter (Suchsel): jede Zelle ein anklickbarer Buchstabe. Erste und letzte Zelle
     eines Begriffs antippen (waagrecht oder senkrecht) - siehe Event-Wiring q.kind==="wordsearch". */
  .ws-instruction{
    margin:0 0 14px; padding:10px 14px; border-radius:var(--radius-md);
    background:var(--accent-soft); border:1px solid color-mix(in srgb, var(--accent) 25%, transparent);
    font-size:13.5px; font-weight:600; color:var(--ink); line-height:1.4;
  }
  .ws-instruction strong{color:var(--accent);}
  .ws-board{
    display:grid; gap:2px; margin:4px auto 14px; max-width:420px;
  }
  .ws-cell{
    aspect-ratio:1; display:flex; align-items:center; justify-content:center;
    font-weight:700; font-size:12.5px; font-family:inherit; color:var(--ink);
    border:1px solid var(--border); border-radius:4px; background:var(--surface-2);
    cursor:pointer; padding:0; line-height:1;
  }
  .ws-cell.selected{background:var(--accent-soft); border-color:var(--accent); color:var(--accent);}
  .ws-cell.found{background:var(--success-soft); border-color:var(--success); color:var(--success);}
  .ws-cell.wrong-flash{background:var(--danger-soft); border-color:var(--danger); color:var(--danger);}
  .ws-progress{font-size:12.5px; font-weight:700; color:var(--ink-faint); letter-spacing:.03em; margin:6px 0 8px;}
  .ws-found{display:flex; flex-wrap:wrap; gap:6px;}
  .ws-found-chip{
    font-size:12px; font-weight:700; padding:4px 10px; border-radius:999px;
    background:var(--success-soft); color:var(--success);
  }
  /* Lückentext mit Wortliste (gapfill): Lücken im Fließtext antippen, dann das passende Wort aus
     der Liste darunter antippen (oder umgekehrt) - siehe Event-Wiring q.kind==="gapfill". */
  .lt-text{
    font-size:16.5px; line-height:2.3; padding:18px 16px; border-radius:var(--radius-md);
    background:var(--surface-2); margin-bottom:16px;
  }
  .lt-blank{
    display:inline-flex; align-items:center; justify-content:center; min-width:96px;
    padding:2px 8px; margin:0 2px; border:none; border-bottom:2px dashed var(--ink-faint);
    border-radius:6px 6px 0 0; background:transparent; font:inherit; font-weight:700;
    color:var(--ink); cursor:pointer; vertical-align:middle;
  }
  .lt-blank.active{background:var(--accent-soft); border-bottom-color:var(--accent);}
  .lt-blank.correct{border-bottom:2px solid var(--success); color:var(--success); cursor:default;}
  .lt-blank.wrong-flash{background:var(--danger-soft); border-bottom-color:var(--danger);}
  .lt-wordbank{display:flex; flex-wrap:wrap; gap:8px;}
  .lt-chip{
    padding:9px 15px; border-radius:999px; border:1.5px solid var(--border); background:var(--surface);
    color:var(--ink); font-weight:700; font-size:13.5px; cursor:pointer;
  }
  .lt-chip.active{border-color:var(--accent); background:var(--accent-soft); color:var(--accent);}
  .lt-chip.used{opacity:.35; text-decoration:line-through; cursor:default;}
  .lt-chip.wrong-flash{border-color:var(--danger); background:var(--danger-soft);}
  /* Getippte Lücken (gapfill mit q.typeIn): eigenes <input> statt Wortliste je Lücke. */
  .lt-type-input{
    display:inline-block; box-sizing:content-box; width:8ch; max-width:85vw; padding:3px 8px; margin:0 2px;
    border:none; border-bottom:2px dashed var(--ink-faint); border-radius:6px 6px 0 0;
    background:var(--accent-soft); font:inherit; font-weight:700; color:var(--ink);
    vertical-align:middle; text-align:center;
  }
  .lt-type-input:focus-visible{outline:2px solid var(--accent); outline-offset:1px;}
  .lt-type-input.correct{
    border-bottom:2px solid var(--success); color:var(--success); background:var(--success-soft);
  }
  .lt-type-input.wrong{border-bottom-color:var(--danger); background:var(--danger-soft); color:var(--danger);}

  /* Tabellen-Zuordnung (table-match): Tabelle mit fester linker Spalte, rechte Spalte mit
     Lücken-Kärtchen ("tm-blank"), die Kärtchenbank selbst nutzt bewusst dieselben .lt-chip/
     .lt-wordbank-Stile wie beim Lückentext (gleiche Bedienlogik, gleiches Erscheinungsbild). */
  .tm-table{width:100%; border-collapse:collapse; margin:4px 0 18px; font-size:14px;}
  .tm-table th{
    background:var(--surface-2); color:var(--ink-soft); font-weight:700; font-size:12px;
    text-transform:uppercase; letter-spacing:.03em; padding:9px 10px; border:1px solid var(--border);
    text-align:left;
  }
  .tm-table td{border:1px solid var(--border); padding:8px 10px; vertical-align:middle;}
  .tm-given{font-weight:700; background:var(--surface-2); white-space:nowrap;}
  .tm-answer{display:flex; flex-wrap:wrap; gap:6px;}
  .tm-blank{
    min-width:120px; min-height:36px; padding:6px 10px; border:none;
    border-bottom:2px dashed var(--ink-faint); border-radius:6px 6px 0 0; background:transparent;
    font:inherit; font-weight:700; font-size:13.5px; color:var(--ink); cursor:pointer; text-align:left;
  }
  .tm-blank.active{background:var(--accent-soft); border-bottom-color:var(--accent);}
  .tm-blank.correct{border-bottom:2px solid var(--success); color:var(--success); cursor:default;}
  .tm-blank.wrong-flash{background:var(--danger-soft); border-bottom-color:var(--danger);}
  /* Pop-up nach vollständig richtiger Tabelle: fordert zum Übernehmen ins Heft auf, muss aktiv
     geschlossen werden (kein Auto-Ausblenden), damit es wirklich wahrgenommen wird. */
  .tm-popup-overlay{
    position:fixed; inset:0; z-index:800; display:flex; align-items:center; justify-content:center;
    background:rgba(20,20,19,.5); padding:24px;
  }
  .tm-popup-card{
    max-width:340px; width:100%; text-align:center; background:var(--surface);
    border:1px solid var(--border); border-radius:var(--radius-lg); box-shadow:var(--shadow);
    padding:26px 22px;
  }
  .tm-popup-card p{font-size:16px; font-weight:700; color:var(--ink); margin:0 0 18px;}
  /* Variante für Pop-ups mit längerem Fließtext (z.B. der fertig ausgefüllte Merksatz bei einer
     getippten Lücken-Übung) statt einer kurzen, fett zentrierten Anweisung: linksbündig, normale
     Schriftstärke, etwas breiter. */
  .tm-popup-card.text-content{max-width:480px; text-align:left;}
  .tm-popup-card.text-content h3{
    font-family:var(--font-display); font-size:17px; font-weight:700; color:var(--ink);
    text-align:center; margin:0 0 16px;
  }
  .tm-popup-card.text-content p{
    font-size:15px; font-weight:500; line-height:1.6; color:var(--ink); text-align:left; margin:0 0 14px;
  }
  .tm-popup-close{
    background:var(--accent); color:var(--accent-ink); border:none; border-radius:999px;
    padding:11px 22px; font-weight:700; font-size:14.5px; cursor:pointer;
  }
  .mm-tile{
    position:relative; min-height:48px; border-radius:10px; border:1.5px dashed var(--border);
    background:var(--surface-2); display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:2px; padding:4px 3px; text-align:center; color:var(--ink-soft);
    transition:background .15s ease, border-color .15s ease;
  }
  .mm-tile .mm-icon{font-size:24px; line-height:1;}
  .mm-tile .mm-icon svg{width:44px; height:44px; display:block;}
  .mm-tile .mm-label{font-size:11px; font-weight:700; line-height:1.15;}
  .mm-tile .mm-label b{color:var(--mark); background:var(--mark-soft); font-weight:800; border-radius:3px; padding:0 1px;}
  .mm-tile.fixed{border-style:solid; border-color:var(--accent); background:var(--accent-soft); color:var(--accent);}
  .mm-tile[data-target]{cursor:pointer;}
  .mm-tile.correct{border-style:solid; border-color:var(--success); background:var(--success-soft); color:var(--success);}
  .mm-tile.wrong-flash{border-style:solid; border-color:var(--danger); background:var(--danger-soft);}
  .chip-tray{display:flex; flex-wrap:wrap; gap:8px; margin-top:2px;}
  .mm-chip{
    padding:9px 15px; border-radius:999px; border:1.5px solid var(--border); background:var(--surface);
    color:var(--ink); font-weight:700; font-size:13.5px; cursor:grab; touch-action:none;
    user-select:none; -webkit-user-select:none;
  }
  .mm-chip.used{display:none;}
  .mm-chip.dragging{opacity:.35;}
  .mm-chip-ghost{
    position:fixed; z-index:999; pointer-events:none; padding:9px 15px; border-radius:999px;
    background:var(--accent); color:var(--accent-ink); font-weight:700; font-size:13.5px; box-shadow:var(--shadow);
    transform:translate(-50%,-50%); white-space:nowrap;
  }
  /* Symbol-Kreise als Chips (Strategien-Zuordnung) - rund statt Pille, Farbe kommt per inline style */
  .mm-chip.mm-chip-badge{
    padding:0; width:36px; height:36px; border-radius:50%; border:none; color:#fff;
    font-weight:800; font-size:13px; display:flex; align-items:center; justify-content:center;
    box-shadow:0 1px 3px rgba(0,0,0,.2);
  }
  .mm-chip.mm-chip-badge .icon-glyph, .mm-chip-ghost.mm-chip-ghost-badge .icon-glyph{width:22px; height:22px; font-size:17px;}
  .mm-chip.mm-chip-badge .icon-glyph svg, .mm-chip-ghost.mm-chip-ghost-badge .icon-glyph svg{width:22px; height:22px;}
  .mm-chip-ghost.mm-chip-ghost-badge{
    padding:0; width:36px; height:36px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    color:#fff; font-weight:800; font-size:13px;
  }
  .mm-chip-ghost.mm-chip-ghost-badge svg{width:18px; height:18px;}

  /* Verschachtelte Kreis-Zuordnung (map-match mit q.layout==="nested-circles", z.B. "Grundlagen
     der Landwirtschaft"): drei große, farbige Kreise (Überbegriffe) mit kleineren Kreisen darin
     (Begriffe) und je einem oder mehreren Erklärungs-Kärtchen direkt darunter. Technisch nutzt das
     GENAU dieselbe Zieh-Logik wie die anderen map-match-Übungen (jedes Kreis-/Kärtchen-Element ist
     ein normales ".mm-tile[data-target]", nur eigenständig positioniert statt im CSS-Grid) -
     deshalb sind alle Ziele bewusst BLATT-Elemente ohne eigene Kind-Elemente: die Zieh-Logik
     ersetzt bei richtiger Antwort das komplette innerHTML einer Kachel, das darf also nirgends
     verschachtelten Inhalt zerstören. Der große Kreis selbst ist deshalb NUR Dekoration (kein
     Ziel) - das Überbegriff-Wort landet auf einem eigenen kleinen "Label-Pill" ganz oben im Kreis.
     .filled (per data-fill-target in der Zieh-Logik ergänzt) färbt den Hintergrund erst bei
     richtiger Antwort ein, damit die Farbe nicht vorher schon den Überbegriff verrät. */
  .nc-board{display:flex; flex-direction:column; align-items:center; gap:34px; margin:8px 0 18px;}
  .nc-circle{
    position:relative; width:100%; max-width:340px; aspect-ratio:1; border-radius:50%;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px;
    border:3px dashed var(--border); background:var(--surface); padding:22px 18px; text-align:center;
  }
  .nc-circle.filled{border-style:solid;}
  .nc-circle.nc-boden.filled{background:#DCE3FA; border-color:#3454D1;}
  .nc-circle.nc-temp.filled{background:#FBEBD9; border-color:#C97A2B;}
  .nc-circle.nc-hoehe.filled{background:#DFF0E4; border-color:#237A4B;}
  .nc-label-pill{
    min-width:0; width:auto; max-width:230px; padding:10px 18px; font-size:14.5px; font-weight:700;
    border-radius:999px;
  }
  .nc-term-cols{display:flex; gap:8px; justify-content:center; align-items:flex-start; flex-wrap:wrap;}
  .nc-term-col{display:flex; flex-direction:column; align-items:center; gap:6px; width:30%; min-width:84px;}
  .nc-term{
    width:100%; aspect-ratio:1; border-radius:50%; font-size:10px; padding:4px;
    overflow-wrap:break-word; -webkit-hyphens:auto; hyphens:auto;
  }
  .nc-explain{
    width:100%; min-height:0; border-radius:9px; font-size:8.5px; font-weight:700; padding:5px 4px; line-height:1.25;
    overflow-wrap:break-word; -webkit-hyphens:auto; hyphens:auto;
  }
  .nc-circle.nc-boden .mm-tile.correct{border-color:#3454D1; background:#fff; color:var(--ink);}
  .nc-circle.nc-temp .mm-tile.correct{border-color:#C97A2B; background:#fff; color:var(--ink);}
  .nc-circle.nc-hoehe .mm-tile.correct{border-color:#237A4B; background:#fff; color:var(--ink);}
  .mm-chip.nc-category{border-color:#9aa8c9; background:#F1F3FC; color:#3454D1;}
  .mm-chip.nc-fact{font-size:11px; font-weight:600; color:var(--ink-soft);}

  /* "Wörter in Kreise sortieren" (circle-sort): 5 feste, immer sichtbare Strategie-Kreise im
     Hintergrund, ein Wort nach dem anderen wird nacheinander in den passenden Kreis gezogen. */
  /* "Wörter in Kreise sortieren" (Aufgabe: circle-sort) läuft im Vollbild: die Übung legt sich
     über die ganze Seite (Kopfbereich/Fortschrittsleiste werden dabei überdeckt), das Wort steht
     fest in der Mitte, die 5 Strategie-Kreise stehen ringsherum darum verteilt. */
  .cs-fullscreen{
    position:fixed; inset:0; z-index:500; background:var(--bg);
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:26px;
    padding:22px 16px calc(16px + env(safe-area-inset-bottom, 0px));
    overflow:auto;
  }
  .cs-fs-top{text-align:center; max-width:440px;}
  .cs-progress{font-size:12.5px; font-weight:700; color:var(--ink-faint); letter-spacing:.04em; text-transform:uppercase; margin-bottom:6px;}
  .cs-fs-hint{margin:0; font-size:13.5px; color:var(--ink-soft);}
  .cs-fs-stage{position:relative; width:min(90vw,440px); height:min(90vw,440px); flex:none;}
  .cs-word{
    position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); z-index:2;
    padding:14px 22px; border-radius:999px; background:var(--surface); border:2px solid var(--border);
    font-size:19px; font-weight:700; cursor:grab; box-shadow:0 2px 8px rgba(0,0,0,.16); touch-action:none;
    text-align:center; max-width:78%; white-space:nowrap;
  }
  .cs-word.dragging{opacity:.35;}
  .cs-word b{color:var(--mark); background:var(--mark-soft); font-weight:800; border-radius:4px; padding:0 3px;}
  .cs-circle{
    position:absolute; transform:translate(-50%,-50%); width:92px; height:92px; margin:0;
    border-radius:50%; display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:4px; color:#fff; text-align:center; padding:6px; box-shadow:0 1px 2px rgba(0,0,0,.18); border:3px solid transparent;
  }
  .cs-circle .icon-glyph{width:44px; height:44px; font-size:32px;}
  .cs-circle .icon-glyph svg{width:44px; height:44px;}
  .cs-circle-label{font-size:10px; font-weight:700; line-height:1.1;}
  .cs-circle.correct-flash{border-color:#fff; box-shadow:0 0 0 4px rgba(255,255,255,.55);}
  .cs-circle.wrong-flash{border-color:var(--danger);}
  /* Kurzes Daumen-hoch/Smiley-Pop-up bei richtiger Zuordnung - erscheint kurz und verschwindet
     wieder von selbst, damit die Schüler sofort sehen, dass es richtig war. */
  .cs-pop{
    position:absolute; top:50%; left:50%; font-size:36px; line-height:1; pointer-events:none;
    transform:translate(-50%,-50%) scale(.4); opacity:0;
    animation:csPop .8s ease-out forwards;
    filter:drop-shadow(0 2px 3px rgba(0,0,0,.25));
  }
  @keyframes csPop{
    0%{ opacity:0; transform:translate(-50%,-50%) scale(.4); }
    20%{ opacity:1; transform:translate(-50%,-55%) scale(1.2); }
    55%{ opacity:1; transform:translate(-50%,-60%) scale(1); }
    100%{ opacity:0; transform:translate(-50%,-80%) scale(.9); }
  }
  .cs-word-ghost{
    position:fixed; z-index:999; pointer-events:none; padding:14px 26px; border-radius:999px; background:var(--surface);
    border:2px solid var(--border); font-size:20px; font-weight:700; transform:translate(-50%,-50%); box-shadow:0 4px 10px rgba(0,0,0,.25);
  }
  .cs-word-ghost b{color:var(--mark); background:var(--mark-soft); font-weight:800; border-radius:4px; padding:0 3px;}

  /* Kartenaufgaben mit Ziehzielen (Bundesländer/Nachbarländer) laufen ebenfalls im Vollbild wie
     circle-sort: auf kleinen/niedrigen Bildschirmen (Handy quer/hoch) waren Karte + Chip-Leiste
     zusammen sonst höher als der sichtbare Bereich - während des Ziehens kann man aber nicht
     scrollen, ein Chip außerhalb des sichtbaren Bereichs war dann gar nicht erreichbar. Im Vollbild
     bekommt die Karte per flex:1 + min-height:0 nur noch so viel Platz wie nach Hinweistext und
     Chip-Leiste übrig bleibt und schrumpft (unter Beibehaltung ihres Seitenverhältnisses) automatisch
     mit - Karte UND alle Chips sind dadurch immer gleichzeitig sichtbar und erreichbar. */
  .mm-fullscreen{
    position:fixed; inset:0; z-index:500; background:var(--bg);
    display:flex; flex-direction:column; align-items:stretch; gap:10px;
    padding:16px 16px calc(14px + env(safe-area-inset-bottom, 0px));
    overflow:auto;
  }
  .mm-fs-top{flex:none; text-align:center;}
  .mm-fs-hint{margin:0; font-size:14.5px; font-weight:700; color:var(--ink);}
  .mm-fs-stage{flex:1 1 auto; min-height:0; display:flex; align-items:center; justify-content:center;}
  .mm-fs-stage .de-map{width:auto; max-width:100%; height:auto; max-height:100%; margin:0;}
  .mm-fullscreen .chip-tray{flex:none; justify-content:center;}

  /* Echte Deutschlandkarte (Bundesländer) für "Wo liegt Bayern?" - Umrisse aus einer
     d-maps.com-Vorlage, jedes Bundesland eine eigene anklickbare/bedroppbare Fläche. */
  .de-map{width:100%; max-width:420px; display:block; margin:4px auto 16px; touch-action:none;}
  .de-tile polygon{
    fill:var(--surface-2); stroke:var(--border); stroke-width:1.4; stroke-linejoin:round;
    transition:fill .15s ease, stroke .15s ease; cursor:pointer;
  }
  .de-tile:not([data-target]) polygon{cursor:default;}
  .de-tile.correct polygon{fill:var(--success-soft); stroke:var(--success);}
  .de-tile.wrong-flash polygon{fill:var(--danger-soft); stroke:var(--danger);}
  .de-tile.fixed polygon{fill:var(--accent-soft); stroke:var(--accent);}
  .de-tile.fixed .de-label{fill:var(--accent); color:var(--accent);}
  .de-label{
    font-size:11px; font-weight:700; fill:var(--ink); color:var(--ink); text-anchor:middle;
    paint-order:stroke; stroke:var(--surface); stroke-width:3px; stroke-linejoin:round;
    pointer-events:none;
  }
  /* Flüsse (Teil "Regionen zuordnen"): eigene Farbvariante statt des normalen Grün, weil ein
     korrekt zugeordneter Fluss sich wie auf einer echten Karte blau färben soll. 3 Klassen sind
     spezifischer als ".de-tile.correct" (2 Klassen) - überschreibt also automatisch, unabhängig
     von der Reihenfolge im Stylesheet. Beschriftung etwas kleiner, damit sie schmal neben dem
     Flussband Platz hat und die restliche Karte nicht zustellt. */
  .de-tile.river polygon{stroke-width:1;}
  .de-tile.river.correct polygon{fill:#60a5fa; stroke:#2563eb;}
  .de-tile.river .de-label{font-size:9px; fill:#1d4ed8; color:#1d4ed8;}
  /* "Regionen zuordnen" nutzt jetzt die echte, hochgeladene Kartenvorlage als Bild im Hintergrund
     (bayernMapHtml()) statt eines nachgezeichneten Umrisses. Die Ziel-Polygone (Regionen/Flüsse/
     Städte) liegen halbtransparent DARÜBER, damit die echte Karte darunter erkennbar bleibt - nur
     "richtig" füllt sich (wie bisher) kräftig grün/blau. Etwas größer angezeigt, weil die echte
     Karte viel feine Beschriftung enthält, die sonst zu klein zum Lesen wäre. */
  .de-map.bayern-real{max-width:560px;}
  .de-map.bayern-real .de-tile:not(.correct):not(.wrong-flash) polygon{
    fill:rgba(37,99,235,.10); stroke:rgba(37,99,235,.6); stroke-width:1.6; stroke-dasharray:3 2;
    pointer-events:fill;
  }
  .de-map.bayern-real .de-tile.river:not(.correct):not(.wrong-flash) polygon{
    fill:rgba(37,99,235,.16); stroke:rgba(37,99,235,.5); stroke-width:1; stroke-dasharray:none;
  }
  /* Feedback von Manuel: bei "richtig" sollen Regionen UND Flüsse - wie vorher beim Antworten -
     durchsichtig bleiben (nur die Farbe wechselt von Blau auf Grün), damit die Stadt-/Ortsnamen
     der echten Karte darunter weiterhin lesbar bleiben. Nur die Städte-Teilaufgabe (kein
     ".region", kein ".river") bleibt bewusst wie zuvor kräftig/deckend grün (siehe globale Regel
     ".de-tile.correct polygon" oben) - dort passt das gut und soll laut Rückmeldung so bleiben. */
  .de-map.bayern-real .de-tile.region.correct polygon{
    fill:rgba(22,163,74,.22); stroke:rgba(21,128,61,.85); stroke-width:1.8; stroke-dasharray:none;
  }
  .de-map.bayern-real .de-tile.river.correct polygon{
    fill:rgba(37,99,235,.38); stroke:rgba(29,78,216,.9); stroke-width:1.6;
  }
  .skip-btn{
    margin-right:auto; background:transparent; border:1.5px solid var(--border); color:var(--ink-soft);
    border-radius:999px; padding:11px 18px; font-weight:700; font-size:14px; cursor:pointer;
  }
  .skip-btn:hover{border-color:var(--danger); color:var(--danger);}
  .result{text-align:center; padding:20px 0 6px;}
  .result .score{font-family:var(--font-mono); font-size:52px; font-weight:600; color:var(--accent);}
  .result p{color:var(--ink-soft); margin-top:6px;}
  .result-table{
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-md);
    overflow:hidden; margin-bottom:22px;
  }
  .result-row{
    display:flex; align-items:center; gap:12px; padding:12px 16px;
    border-bottom:1px solid var(--border); font-size:14px;
    cursor:pointer; background:transparent; width:100%; text-align:left; border-left:none; border-right:none; border-top:none;
    color:inherit; font-family:inherit;
  }
  .result-row:last-child{border-bottom:none;}
  .result-row:hover{background:var(--surface-2);}
  .result-hint{font-size:13px; color:var(--ink-faint); margin:-10px 0 18px; text-align:center;}
  .result-num{color:var(--ink-faint); width:20px; flex:none;}
  .result-label{flex:1; min-width:0; font-weight:600;}
  .result-attempts{color:var(--ink-soft); flex:none;}
  .result-status{flex:none; font-weight:700; font-size:13px; padding:3px 10px; border-radius:999px;}
  .result-status.ok{background:var(--success-soft); color:var(--success);}
  .result-status.bad{background:var(--danger-soft); color:var(--danger);}
  .restart-btn{
    background:var(--surface-2); border:1px solid var(--border); color:var(--ink);
    border-radius:999px; padding:10px 20px; font-weight:700; font-size:14px; cursor:pointer;
  }
  @media (max-width:480px){
    .result-row{flex-wrap:wrap;}
    .result-label{order:1; width:100%; margin-top:2px;}
  }

  /* Worksheet / solution */
  .doc-card{
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-lg);
    padding:30px; box-shadow:var(--shadow); position:relative; overflow:hidden;
  }
  .doc-card::before{
    content:""; position:absolute; inset:0 0 auto 0; height:6px;
    background:repeating-linear-gradient(90deg, var(--accent) 0 14px, transparent 14px 22px);
    opacity:.5;
  }
  .doc-head{display:flex; justify-content:space-between; align-items:flex-start; gap:20px; margin-bottom:22px;}
  .doc-head h2{font-size:21px;}

/* Städte-Karte (Teil 3 von "Regionen zuordnen"): fünf auf der echten Karte fett gedruckte,
   besonders markante Städte - ihre Namen sind im Kartenbild (BAYERN_MAP_IMG_MASKED) überdeckt,
   die Punktsymbole selbst bleiben sichtbar. Radius bewusst klein - die Schüler sollen mit dem
   Stift genau treffen, nicht grob raten können. */
const BAYERN_STAEDTE = [
  { id:"muenchen",   label:"München",    cx:592, cy:763 },
  { id:"nuernberg",  label:"Nürnberg",   cx:489, cy:378 },
  { id:"augsburg",   label:"Augsburg",   cx:451, cy:696 },
  { id:"regensburg", label:"Regensburg", cx:683, cy:508 },
  { id:"ingolstadt", label:"Ingolstadt", cx:558, cy:582 },
];
/* Kleines n-Eck als Kreis-Annäherung, als <polygon> statt <circle> - so gelten dieselben
   ".de-tile polygon"-CSS-Regeln (Füllfarbe/Rahmen bei richtig/falsch) ohne zusätzliches CSS. */
function circlePolygon(cx, cy, r, sides){
  sides = sides || 22;
  const pts = [];
  for (let k=0; k<sides; k++){
    const angle = (k/sides) * 2 * Math.PI;
    pts.push((cx + r*Math.cos(angle)).toFixed(1) + "," + (cy + r*Math.sin(angle)).toFixed(1));
  }
  return pts.join(" ");
}
/* Wandelt eine Fluss-Mittellinie (Liste von [x,y]-Punkten) in ein schmales, geschlossenes Band
   (Polygon) um - so gilt auch hier dieselbe ".de-tile polygon"-CSS-Logik, nur mit einer eigenen
   Farbvariante fürs Ergebnis (".de-tile.river.correct", siehe CSS: blau statt grün), ganz ohne
   eigenes <line>/<path>-Element. "width" bewusst so gewählt, dass das Band gut treffbar ist, ohne
   die echte Karte darunter zu sehr zuzudecken. */
function ribbonPolygon(points, width){
  const hw = width / 2;
  const left = [], right = [];
  for (let i=0; i<points.length; i++){
    const prev = points[i-1] || points[i];
    const next = points[i+1] || points[i];
    const dx = next[0]-prev[0], dy = next[1]-prev[1];
    const len = Math.hypot(dx,dy) || 1;
    const px = -dy/len, py = dx/len;
    left.push((points[i][0]+px*hw).toFixed(1) + "," + (points[i][1]+py*hw).toFixed(1));
    right.push((points[i][0]-px*hw).toFixed(1) + "," + (points[i][1]-py*hw).toFixed(1));
  }
  return left.concat(right.reverse()).join(" ");
}
/* Rendert die Bayern-Karte für alle drei Teile von "Regionen zuordnen": echtes Kartenbild
   (BAYERN_MAP_IMG bzw. für "staedte" BAYERN_MAP_IMG_MASKED) als Hintergrund in einem <image>,
   darüber - genau wie bei deMapHtml()/nachbarnMapHtml() - anklickbare/bedroppbare .de-tile-
   Gruppen mit <polygon>-Zielflächen (nur halbtransparent, damit die echte Karte durchscheint).
   Je nach "layer" sind nur die Regionen ODER nur die Flüsse ODER nur die Städte die eigentlichen
   Ziele - so überlagern sich die drei Ebenen nie gegenseitig und jede Teilaufgabe bleibt
   übersichtlich. */
function bayernMapHtml(layer){
  const img = layer === "staedte" ? BAYERN_MAP_IMG_MASKED : BAYERN_MAP_IMG;
  const bg = `<image href="${img}" x="0" y="0" width="1100" height="1086" preserveAspectRatio="xMidYMid meet"></image>`;
  let groups;
  if (layer === "fluesse"){
    groups = BAYERN_FLUESSE.map(r => {
      /* Breite bewusst schmal (12) - die Mittellinie folgt jetzt Punkt für Punkt der echten,
         auf dem Kartenbild sichtbaren blauen Flusslinie (per Bildanalyse ermittelt, nicht mehr
         nur grob abgelesen), das Band muss sie also nur noch knapp einrahmen. */
      const poly = `<polygon points="${ribbonPolygon(r.points, 12)}"></polygon>`;
      return `<g class="de-tile river" data-id="${esc(r.id)}" data-label="${esc(r.label)}" data-cx="${r.labelX}" data-cy="${r.labelY}" data-target="1">${poly}</g>`;
    }).join("");
  } else if (layer === "staedte"){
    groups = BAYERN_STAEDTE.map(s => {
      const poly = `<polygon points="${circlePolygon(s.cx, s.cy, 34)}"></polygon>`;
      return `<g class="de-tile" data-id="${esc(s.id)}" data-label="${esc(s.label)}" data-cx="${s.cx}" data-cy="${(s.cy + 46).toFixed(1)}" data-target="1">${poly}</g>`;
    }).join("");
  } else {
    /* Eigene Zusatzklasse "region" (nur hier, nicht bei Städten) - so kann das CSS für
       "richtig" bei Regionen ein eigenes, transparentes Grün verwenden, ohne die Städte-Ebene
       (dort bewusst weiterhin volles Deckend-Grün, siehe Feedback "Aufgabe 3 kann man lassen")
       mitzubeeinflussen. */
    groups = BAYERN_REGIONEN.map(r => {
      const poly = `<polygon points="${circlePolygon(r.cx, r.cy, 85)}"></polygon>`;
      return `<g class="de-tile region" data-id="${esc(r.id)}" data-label="${esc(r.label)}" data-cx="${r.cx}" data-cy="${(r.cy).toFixed(1)}" data-target="1">${poly}</g>`;
    }).join("");
  }
  return `<svg class="de-map bayern-real" id="deMap" viewBox="${BAYERN_MAP_VIEWBOX}" xmlns="http://www.w3.org/2000/svg">${bg}${groups}</svg>`;
}

/* ---------- Hilfsfunktionen ---------- */
function h(strings, ...vals){ return strings.reduce((a,s,i)=>a+s+(vals[i]??""),""); }
function esc(s){ return String(s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
/* q.markWord/q.markPart: markiert die Problemstelle innerhalb eines in q.text eingebetteten Wortes
   fett (genauso wie highlightLabel() das bei Kacheln/Kreisen tut), z.B. bei "Wörter korrigieren":
   markWord ist die falsch geschriebene Wortform, wie sie wörtlich in q.text vorkommt (z.B. "Herte"),
   markPart die konkrete Problemstelle darin (z.B. "e", das eigentlich "ä" sein müsste). Erst das
   Wort im Satz lokalisieren, dann NUR innerhalb dieses Wortes nach der Problemstelle suchen -
   so kann ein kurzer, häufiger markPart (z.B. ein einzelner Buchstabe) nicht versehentlich weiter
   vorne im Satz (z.B. in "Welche") matchen. Ohne markWord/markPart bleibt es wie bisher esc(q.text). */
function markWordInText(text, markWord, markPart){
  const s = String(text);
  const wIdx = markWord ? s.indexOf(markWord) : -1;
  if (wIdx === -1) return esc(s);
  const before = s.slice(0, wIdx);
  const word = s.slice(wIdx, wIdx + markWord.length);
  const after = s.slice(wIdx + markWord.length);
  return esc(before) + highlightLabel(word, markPart) + esc(after);
}

/* Lernstand pro Übung – lokal im Browser des Schülers gespeichert (kein Server, kein Login).
   Pro Aufgabe wird Status ("open"/"correct"/"skipped") + Versuche gespeichert, damit man
   a) den Fortschritt schon während der Übung sieht, b) beim Wiederkommen dort weitermacht,
   wo man aufgehört hat, und c) gezielt einzelne Aufgaben nochmal aufrufen kann. */
function exerciseStateKey(slug){ return "lernportal:state:" + slug; }
function freshExerciseState(total){
  return { q: Array.from({length: total}, () => ({status:"open", attempts:0})) };
}
function loadExerciseState(slug, total){
  try {
    const raw = localStorage.getItem(exerciseStateKey(slug));
    if (raw){
      const parsed = JSON.parse(raw);
      if (parsed && Array.isArray(parsed.q) && parsed.q.length === total) return parsed;
    }
  } catch(e){ /* localStorage nicht verfügbar (z.B. privater Modus) - einfach ignorieren */ }
  return freshExerciseState(total);
}
function saveExerciseState(slug, state){
  try { localStorage.setItem(exerciseStateKey(slug), JSON.stringify(state)); }
  catch(e){ /* ignorieren, z.B. privater Modus */ }
}
/* Für die Fortschrittsanzeige im Kapitel (S.8/S.9 usw.) */
function exerciseProgress(slug){
  const set = exerciseSets[slug];
  if (!set) return null;
  const state = loadExerciseState(slug, set.questions.length);
  const total = state.q.length;
  const correct = state.q.filter(x => x.status === "correct").length;
  return { correct, total };
}

/* Gesperrte Übungen ("locked:true") sind für alle gleich gesperrt - auch für Manuel selbst.
   Freischalten geht nur, indem das Flag im Code geändert und neu veröffentlicht wird. */
function isLocked(set, slug){
  if (!set) return false;
  if (hasPreviewAccess()) return false;
  if (!set.locked) return false; /* im Code freigeschaltet -> immer frei, egal was ein (evtl. veralteter/nicht erreichbarer) Fernstatus zwischenspeichert */
  if (slug && remoteLocksCache && Object.prototype.hasOwnProperty.call(remoteLocksCache, slug)){
    return !!remoteLocksCache[slug];
  }
  return !!set.locked;
}

/* Rendert eine Tabellen-Aufgabe eines Arbeitsblatts. showSolved=false -> leere Felder ("given"),
   showSolved=true -> vollständige Lösung, dabei die vorher leeren Felder farblich hervorgehoben. */
function tableTaskHtml(t, num, showSolved){
  const headCells = t.columns.map(c => `<th>${esc(c)}</th>`).join("");
  const bodyRows = t.rows.map(r => {

      const cls = (showSolved && giv === "") ? ' class="tt-solved"' : "";

    }).join("");
    return `<tr><th class="tt-rowlabel">${esc(r.label)}</th>${cells}</tr>`;
  }).join("");

        <tbody>${bodyRows}</tbody>
      </table></div>
    </div>

}

function polarPoint(cx,cy,r,angleDeg){
  const rad = (angleDeg - 90) * Math.PI / 180;
  return { x: cx + r*Math.cos(rad), y: cy + r*Math.sin(rad) };
}

/* Statische Anschauungs-Grafiken für "Flächenanteile ablesen" (eigene Formen, keine Buchgrafiken) */
function shapeSvg(shape, size){
  size = size || 160;
  const cx = size/2, cy = size/2, r = size/2 - 4;
  if (shape.type === "circle"){
    let html = "";
    for (let i=0;i<shape.total;i++){
      const a0 = i * 360/shape.total, a1 = (i+1) * 360/shape.total;
      const p0 = polarPoint(cx,cy,r,a0), p1 = polarPoint(cx,cy,r,a1);
      const large = (a1-a0) > 180 ? 1 : 0;
      const fill = i < shape.shaded ? "var(--accent)" : "var(--surface-2)";
      html += `<path d="M ${cx},${cy} L ${p0.x.toFixed(2)},${p0.y.toFixed(2)} A ${r},${r} 0 ${large} 1 ${p1.x.toFixed(2)},${p1.y.toFixed(2)} Z" fill="${fill}" stroke="var(--surface)" stroke-width="2"/>`;
    }
    return `<svg viewBox="0 0 ${size} ${size}" width="${size}" height="${size}" role="img" aria-label="Kreisdiagramm">${html}</svg>`;
  }
  if (shape.type === "stripes"){
    const w = size/shape.total;
    let html = "";
    for (let i=0;i<shape.total;i++){
      const fill = i < shape.shaded ? "var(--accent)" : "var(--surface-2)";
      html += `<rect x="${(i*w).toFixed(2)}" y="0" width="${(w-2).toFixed(2)}" height="${size}" fill="${fill}"/>`;
    }
    return `<svg viewBox="0 0 ${size} ${size}" width="${size}" height="${size}" role="img" aria-label="Streifendiagramm">${html}</svg>`;
  }
  if (shape.type === "grid"){
    const w = size/shape.cols, hgt = size/shape.rows;
    let html = "", n=0;
    for (let r0=0;r0<shape.rows;r0++){
      for (let c0=0;c0<shape.cols;c0++){
        const fill = n < shape.shaded ? "var(--accent)" : "var(--surface-2)";
        html += `<rect x="${(c0*w).toFixed(2)}" y="${(r0*hgt).toFixed(2)}" width="${(w-2).toFixed(2)}" height="${(hgt-2).toFixed(2)}" fill="${fill}"/>`;
        n++;
      }
    }
    return `<svg viewBox="0 0 ${size} ${size}" width="${size}" height="${size}" role="img" aria-label="Rasterdiagramm">${html}</svg>`;
  }
  return "";
}

/* Kreisdiagramm mit Legende für "Kreisdiagramme lesen" */
function pieChartHtml(chart, size){
  size = size || 150;
  const cx = size/2, cy = size/2, r = size/2 - 4;
  let cumulative = 0, paths = "";
  chart.segments.forEach(seg=>{
    const a0 = cumulative*3.6, a1 = (cumulative+seg.value)*3.6;
    const p0 = polarPoint(cx,cy,r,a0), p1 = polarPoint(cx,cy,r,a1);
    const large = (a1-a0) > 180 ? 1 : 0;
    paths += `<path d="M ${cx},${cy} L ${p0.x.toFixed(2)},${p0.y.toFixed(2)} A ${r},${r} 0 ${large} 1 ${p1.x.toFixed(2)},${p1.y.toFixed(2)} Z" fill="${seg.color}" stroke="var(--surface)" stroke-width="2"/>`;
    cumulative += seg.value;
  });
  const legend = chart.segments.map(seg=>`
    <div class="legend-row"><span class="legend-dot" style="background:${seg.color}"></span>${esc(seg.label)} <span class="num legend-pct">${seg.value} %</span></div>
  `).join("");
  return `
    <div class="chart-block">
      <svg viewBox="0 0 ${size} ${size}" width="${size}" height="${size}" role="img" aria-label="${esc(chart.caption)}">${paths}</svg>
      <div class="legend">
        <div class="legend-caption">${esc(chart.caption)}</div>
        ${legend}
      </div>
    </div>
  `;
}

/* Zeigt einen kleinen Kartenlegende-Ausschnitt (Farbfläche und/oder Symbol + Bezeichnung) als

/* Kachelraster für die Karten-/Bild-Zuordnungsübungen (Bundesländer, Nachbarländer, Bauernhof).
   revealAll=true zeigt alle Beschriftungen (nach "Überspringen"); sonst nur fixe Kacheln (z.B. "Deutschland"). */
/* Markiert die entscheidende Buchstabenfolge in einem Wort fett (z.B. "äu" in "träumen"), damit
   sichtbar wird, WARUM ein Wort zu einer bestimmten Strategie gehört - ohne diese Markierung ist
   nicht erkennbar, welche Rechtschreib-Problemstellung das Wort überhaupt zeigt. */
function highlightLabel(label, mark){
  if (!mark) return esc(label);
  const idx = label.indexOf(mark);
  if (idx === -1) return esc(label);
  const before = label.slice(0, idx);
  const match = label.slice(idx, idx + mark.length);
  const after = label.slice(idx + mark.length);
  return `${esc(before)}<b>${esc(match)}</b>${esc(after)}`;
}
function mmBoardHtml(q, revealAll){
  const cells = q.tiles.map(t => {
    let cls = "mm-tile";
    if (t.fixed) cls += " fixed";
    /* alwaysLabel: die Kachel zeigt ihre Beschriftung von Anfang an (z.B. das Wort selbst) und
       bleibt trotzdem ein normales Drop-Ziel - anders als "fixed" (das ist nur Dekoration, kein Ziel). */
    const showLabel = t.fixed || t.alwaysLabel || revealAll;
    const iconHtml = t.icon ? `<span class="mm-icon">${t.icon}</span>` : "";
    const labelHtml = showLabel ? `<span class="mm-label">${highlightLabel(t.label, t.mark)}</span>` : "";
    const targetAttr = t.fixed ? "" : ` data-target="1"`;
    const groupAttr = t.group ? ` data-group="${esc(t.group)}"` : "";
    return `<div class="${cls}" data-id="${esc(t.id)}" data-label="${esc(t.label)}" data-mark="${t.mark ? esc(t.mark) : ""}" data-icon="${t.icon ? esc(t.icon) : ""}"${targetAttr}${groupAttr} style="grid-column:${t.col} / span ${t.colSpan||1}; grid-row:${t.row} / span ${t.rowSpan||1};">${iconHtml}${labelHtml}</div>`;
  }).join("");
  return `<div class="mm-board" id="mmBoard" style="grid-template-columns:repeat(${q.cols},1fr); grid-template-rows:repeat(${q.rows},minmax(48px,1fr));">${cells}</div>`;
}

/* Verschachtelte Kreis-Zuordnung (siehe CSS-Kommentar bei ".nc-board"): q.groups ist eine Liste
   von { id, label, color, terms:[{ id, label, explain:[{id,label}, ...] }, ...] }. Jedes Wort
   (Überbegriff, Begriff, Erklärung) wird ein eigener Chip; alle zusammen kommen gemischt in EINEN
   Wortpool - genau wie bei den anderen map-match-Übungen, nur mit drei "Ebenen" von Zielen statt
   einer. data-fill-target auf dem Label-Pill verweist auf die id des dekorativen großen Kreises,
   damit die Zieh-Logik ihn erst bei richtiger Antwort einfärben kann (siehe dort). */
function nestedCirclesHtml(q){
  const groupsHtml = q.groups.map(g => {
    const termsHtml = g.terms.map(t => {
      const explainHtml = t.explain.map(ex =>
        `<div class="mm-tile nc-explain" data-id="${esc(ex.id)}" data-label="${esc(ex.label)}" data-target="1"></div>`

      <div class="nc-circle nc-${g.color}" id="ncCircle_${esc(g.id)}">
        <div class="mm-tile nc-label-pill" data-id="${esc(g.id)}" data-label="${esc(g.label)}" data-target="1" data-fill-target="ncCircle_${esc(g.id)}"></div>
        <div class="nc-term-cols">${termsHtml}</div>
      </div>`;
  }).join("");

  const chipItems = [];
  q.groups.forEach(g => {
    chipItems.push({ value:g.id, label:g.label, cls:"nc-category" });
    g.terms.forEach(t => {
      chipItems.push({ value:t.id, label:t.label, cls:"" });
      t.explain.forEach(ex => chipItems.push({ value:ex.id, label:ex.label, cls:"nc-fact" }));
    });
  });
  const chipsHtml = shuffled(chipItems).map((c,i) =>
    `<button type="button" class="mm-chip${c.cls ? " "+c.cls : ""}" data-value="${esc(c.value)}" id="chip_${i}">${esc(c.label)}</button>`
  ).join("");

  return `

    <p class="gap-hint">👉 Tippe ein Wort an, halte es gedrückt und ziehe es auf den passenden Kreis: erst den Überbegriff, dann die Begriffe, dann die Erklärungen dazu.</p>
    <div class="chip-tray" id="chipTray">${chipsHtml}</div>
  `;
}

/* Rendert die echte Deutschlandkarte (16 Bundesländer, aus DE_STATES) als anklickbare/
   bedroppbare SVG-Flächen. Jedes Bundesland ist eine <g class="de-tile">, kann also wie eine
   .mm-tile behandelt werden (data-id/data-target), nur mit <polygon> statt Kachel-Rechteck. */
/* WICHTIG: Der Name eines Bundeslandes darf vor einer richtigen Antwort NICHT im DOM stehen -
   sonst könnte man ihn z.B. über "Seite durchsuchen" (Strg+F) oder "Alles auswählen" auslesen,
   auch wenn er per CSS unsichtbar wäre. Darum wird hier nur die Fläche (ohne <text>) gerendert;
   das Beschriftungs-<text> fügt revealTileLabel() erst bei einer richtigen Antwort per JS ein. */
function deMapHtml(){
  const groups = DE_STATES.map(s => {
    const polys = s.parts.map(p => `<polygon points="${p}"></polygon>`).join("");
    return `<g class="de-tile" data-id="${esc(s.id)}" data-label="${esc(s.label)}" data-cx="${s.cx}" data-cy="${s.cy}" data-target="1">${polys}</g>`;
  }).join("");
  return `<svg class="de-map" id="deMap" viewBox="${DE_MAP_VIEWBOX}" xmlns="http://www.w3.org/2000/svg">${groups}</svg>`;
}

/* Rendert die Karte für "Deutschlands Nachbarländer" (NACHBAR_STATES, echte Umrisse). Gleiches
   Prinzip wie deMapHtml(): jedes Nachbarland ist ein anklickbares/bedroppbares .de-tile ohne
   sichtbaren Namen, bis die richtige Antwort erfolgt. Deutschland selbst (NACHBAR_GERMANY) dient
   nur der Orientierung - fest eingeblendet, kein Ziehziel, Name von Anfang an sichtbar (kein Geheimnis
   zum Erraten, also unproblematisch, es direkt ins Markup zu schreiben). */
function nachbarnMapHtml(){
  const deParts = NACHBAR_GERMANY.parts.map(p => `<polygon points="${p}"></polygon>`).join("");
  const deGroup = `<g class="de-tile fixed" data-id="deutschland">${deParts}<text class="de-label" x="${NACHBAR_GERMANY.cx}" y="${NACHBAR_GERMANY.cy}">${esc(NACHBAR_GERMANY.label)}</text></g>`;
  const groups = NACHBAR_STATES.map(s => {
    const polys = s.parts.map(p => `<polygon points="${p}"></polygon>`).join("");
    return `<g class="de-tile" data-id="${esc(s.id)}" data-label="${esc(s.label)}" data-cx="${s.cx}" data-cy="${s.cy}" data-target="1">${polys}</g>`;
  }).join("");
  return `<svg class="de-map" id="deMap" viewBox="${NACHBAR_MAP_VIEWBOX}" xmlns="http://www.w3.org/2000/svg">${deGroup}${groups}</svg>`;
}

/* Fügt das Namens-<text> für ein Bundesland erst jetzt ins SVG ein (siehe Hinweis oben) - wird nur
   beim Aufdecken (richtige Antwort oder "Überspringen") aufgerufen, nie beim ersten Rendern. */
function revealTileLabel(tile){
  if (tile.querySelector(".de-label")) return;
  const ns = "http://www.w3.org/2000/svg";
  const text = document.createElementNS(ns, "text");
  text.setAttribute("class", "de-label");
  text.setAttribute("x", tile.dataset.cx);
  text.setAttribute("y", tile.dataset.cy);
  text.textContent = tile.dataset.label;
  tile.appendChild(text);
}

/* Mischt ein Array zufällig (Fisher-Yates) - für die Reihenfolge der Wörter/Kärtchen. */
function shuffled(arr){
  const a = arr.slice();
  for (let i=a.length-1; i>0; i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

function setCrumbs(items){
  document.getElementById("crumbs").innerHTML = items.map((it,i)=>{
    const isLast = i===items.length-1;
    return isLast ? `<span>${esc(it.label)}</span>` : `<a href="${it.href}">${esc(it.label)}</a><span>›</span>`;
  }).join(" ");
}

function normalizeAnswer(s){
  return String(s).trim().toLowerCase().replace(/\s+/g,"").replace(",",".").replace("%","");
}

window.__startExercise = function(slug){
  const set = exerciseSets[slug];
  if (!set) return;
  const total = set.questions.length;
  const state = loadExerciseState(slug, total);
  let i = state.q.findIndex(x => x.status === "open");
  if (i === -1) i = 0;
  let attempts = 0, solved = false;
  const host = document.getElementById("exerciseHost");
  const fill = document.getElementById("progressFill");
  const navHost = document.getElementById("qnav");

  function persist(){ saveExerciseState(slug, state); renderNav(); }

  function renderNav(){
    if (!navHost) return;
    navHost.innerHTML = state.q.map((qs, idx) => {
      let cls = "qnav-btn";
      if (idx === i) cls += " current";
      if (qs.status === "correct") cls += " correct";
      else if (qs.status === "skipped") cls += " skipped";
      const titleBit = qs.status === "correct" ? " – richtig gelöst" : qs.status === "skipped" ? " – noch nicht verstanden" : "";
      return `<button type="button" class="${cls}" data-idx="${idx}" title="Aufgabe ${idx+1}${titleBit}">${idx+1}</button>`;
    }).join("");
    navHost.querySelectorAll(".qnav-btn").forEach(btn=>{
      btn.addEventListener("click", ()=>{
        i = Number(btn.dataset.idx);
        renderQuestion();
      });
    });
  }

  function head(q){
    const meta = q.section ? `${q.section} · Frage ${i+1} von ${total}` : `Frage ${i+1} von ${total}`;
    const badge = q.strategy ? strategyBadgeHtml(q.strategy) : "";
    /* q.bigBadge: großes Symbol als eigentliche Frage-Stellung ("welche Strategie zeigt dieses
       Symbol?") - bewusst getrennt von q.strategy (kleiner, dekorativer Hinweis-Badge), damit hier
       nie versehentlich der Name der Strategie mit verraten wird. */
    const bigBadge = q.bigBadge ? `<div class="big-badge-row">${strategyBadgeHtml(q.bigBadge, true)}</div>` : "";
    const visual = q.shape ? `<div class="shape-block">${shapeSvg(q.shape)}</div>` : (q.chart ? pieChartHtml(q.chart) : "");
    const imageHtml = q.image ? `<div class="qimage-block"><img src="${q.image}" alt="${esc(q.imageAlt || "Abbildung zur Frage")}"></div>` : "";
    const legendHtml = q.legend ? legendKeyHtml(q.legend.items, q.legend.caption) : "";
    const qtextHtml = q.markWord ? markWordInText(q.text, q.markWord, q.markPart) : esc(q.text);
    return `<div class="qmeta-row">${badge}<div class="qmeta">${esc(meta)}</div></div>${bigBadge}${imageHtml}${visual}${legendHtml}<div class="qtext">${qtextHtml}</div>`;
  }

  function tryAgainFeedback(msg){
    const fb = document.getElementById("fb");
    fb.textContent = msg || "Leider falsch – versuch's nochmal.";
    fb.className = "feedback show wrong";
  }

  function goNext(){
    i++;
    if (i < total) renderQuestion(); else renderResult();
  }

  function lockQuestion(status, feedbackText, feedbackClass){
    solved = true;
    state.q[i] = { status, attempts: (state.q[i].attempts || 0) + attempts };
    persist();
    reportResult(slug, i, status, state.q[i].attempts);
    const fb = document.getElementById("fb");
    fb.textContent = feedbackText;
    fb.className = "feedback show " + feedbackClass;
    document.getElementById("nextBtn").classList.add("show");
    const skipBtn = document.getElementById("skipBtn");
    if (skipBtn) skipBtn.style.display = "none";
  }

  function renderReviewCard(q, qState){
    const ok = qState.status === "correct";
    const triesText = qState.attempts ? ` (${qState.attempts} ${qState.attempts===1 ? "Versuch" : "Versuche"})` : "";
    host.innerHTML = `
      <div class="qcard">
        ${head(q)}
        <div class="feedback show ${ok ? "correct" : "wrong"}">${ok ? "✓ Schon richtig gelöst" : "Nicht gelöst"}${triesText}.${ok ? " " + esc(q.explain) : ""}</div>
        <div class="qactions">
          <button class="skip-btn" id="retryBtn">Nochmal versuchen</button>
          <button class="next-btn show" id="nextBtn">${i+1===total ? "Ergebnis ansehen" : "Weiter"}</button>
        </div>
      </div>
    `;
    document.getElementById("retryBtn").addEventListener("click", ()=>{
      state.q[i] = { status:"open", attempts:0 };
      persist();
      renderQuestion();
    });
    document.getElementById("nextBtn").addEventListener("click", goNext);
  }

  function renderQuestion(){
    fill.style.width = Math.round((i / total) * 100) + "%";
    renderNav();
    const q = set.questions[i];
    const qState = state.q[i];
    if (qState.status !== "open"){
      renderReviewCard(q, qState);
      return;
    }
    attempts = 0;
    solved = false;

    let body = "";
    /* Für die Vollbild-Kartenaufgaben (map-match, mapType de-states/de-nachbarn): body enthält
       hier NUR die Karte, der Hinweistext + die Chip-Leiste kommen separat in mmTrayHtml - siehe
       die host.innerHTML-Weiche weiter unten (.mm-fullscreen). */
    let mmTrayHtml = "";
    if (q.kind === "numeric"){
      body = `
        <div class="numeric-row">
          <input type="text" inputmode="decimal" class="numeric-input" id="numInput" placeholder="Antwort" autocomplete="off">
          <button class="check-btn" id="checkBtn">Prüfen</button>
        </div>
      `;
    } else if (q.kind === "grid-shade"){
      let cells = "";
      for (let c=0;c<q.rows*q.cols;c++){ cells += `<button class="shade-cell" data-i="${c}"></button>`; }
      body = `
        <div class="shade-grid" id="shadeGrid" style="grid-template-columns:repeat(${q.cols},1fr);">${cells}</div>
        <div class="shade-count">Gefärbt: <span class="num" id="shadeCount">0</span> / ${q.rows*q.cols} Kästchen</div>
        <div class="qactions" style="margin-top:0;"><button class="check-btn" id="checkBtn">Prüfen</button></div>
      `;
    } else if (q.kind === "click-gap"){
      const wordsHtml = q.tokens.map((w,idx) => {
        let out = `<span class="gap-word">${esc(w)}</span>`;
        if (idx < q.tokens.length - 1){
          out += `<button type="button" class="gap-slot" data-g="${idx}"><span class="gap-comma">,</span></button>`;
        }
        return out + " ";
      }).join("");
      body = `
        <div class="gap-sentence" id="gapSentence">${wordsHtml}</div>
        <p class="gap-hint">Tippe zwischen zwei Wörter, um dort ein Komma zu setzen. Nochmal tippen entfernt es wieder.</p>
        <div class="qactions" style="margin-top:0;"><button class="check-btn" id="checkBtn">Prüfen</button></div>
      `;
    } else if (q.kind === "map-select"){
      body = q.mapType === "de-states" ? deMapHtml() : mmBoardHtml(q, false);
    } else if (q.kind === "map-match" && q.mapType === "de-states"){
      const chipList = shuffled(DE_STATES.map(s => ({ value:s.id, label:s.label })));
      const chipsHtml = chipList.map((chip,idx) => `<button type="button" class="mm-chip" data-value="${esc(chip.value)}" id="chip_${idx}">${esc(chip.label)}</button>`).join("");
      body = deMapHtml();
      mmTrayHtml = `
        <p class="gap-hint">Tippe einen Bundesland-Namen an, halte ihn gedrückt und ziehe ihn auf die passende Fläche auf der Karte.</p>
        <div class="chip-tray" id="chipTray">${chipsHtml}</div>
      `;
    } else if (q.kind === "map-match" && q.mapType === "de-nachbarn"){
      const chipList = shuffled(NACHBAR_STATES.map(s => ({ value:s.id, label:s.label })));
      const chipsHtml = chipList.map((chip,idx) => `<button type="button" class="mm-chip" data-value="${esc(chip.value)}" id="chip_${idx}">${esc(chip.label)}</button>`).join("");
      body = nachbarnMapHtml();
      mmTrayHtml = `
        <p class="gap-hint">Tippe einen Ländernamen an, halte ihn gedrückt und ziehe ihn auf die passende Fläche auf der Karte.</p>
        <div class="chip-tray" id="chipTray">${chipsHtml}</div>
      `;
    } else if (q.kind === "map-match" && q.mapType === "bayern-regionen"){
      const chipList = shuffled(BAYERN_REGIONEN.map(s => ({ value:s.id, label:s.label })));
      const chipsHtml = chipList.map((chip,idx) => `<button type="button" class="mm-chip" data-value="${esc(chip.value)}" id="chip_${idx}">${esc(chip.label)}</button>`).join("");
      body = bayernMapHtml("regionen");
      mmTrayHtml = `
        <p class="gap-hint">Tippe eine Region an, halte sie gedrückt und ziehe sie auf die ungefähre Lage auf der Karte.</p>
