      `;
    } else if (q.kind === "map-match" && q.mapType === "bayern-fluesse"){
      const chipList = shuffled(BAYERN_FLUESSE.map(s => ({ value:s.id, label:s.label })));
      const chipsHtml = chipList.map((chip,idx) => `<button type="button" class="mm-chip" data-value="${esc(chip.value)}" id="chip_${idx}">${esc(chip.label)}</button>`).join("");
      body = bayernMapHtml("fluesse");
      mmTrayHtml = `
        <p class="gap-hint">Tippe einen Flussnamen an, halte ihn gedrückt und ziehe ihn genau auf den passenden Flusslauf auf der Karte.</p>
        <div class="chip-tray" id="chipTray">${chipsHtml}</div>
      `;
    } else if (q.kind === "map-match" && q.mapType === "bayern-staedte"){
      const chipList = shuffled(BAYERN_STAEDTE.map(s => ({ value:s.id, label:s.label })));
      const chipsHtml = chipList.map((chip,idx) => `<button type="button" class="mm-chip" data-value="${esc(chip.value)}" id="chip_${idx}">${esc(chip.label)}</button>`).join("");
      body = bayernMapHtml("staedte");
      mmTrayHtml = `
        <p class="gap-hint">Tippe einen Stadtnamen an, halte ihn gedrückt und ziehe ihn genau auf den passenden Punkt auf der Karte.</p>
        <div class="chip-tray" id="chipTray">${chipsHtml}</div>
      `;
    } else if (q.kind === "map-match" && q.layout === "nested-circles"){
      body = nestedCirclesHtml(q);
    } else if (q.kind === "map-match"){
      const realChips = q.tiles.filter(t=>!t.fixed).map(t => ({ value:t.id, label:t.label }));
      const distractorChipsList = (q.distractorChips || []).map((label,idx) => ({ value:"__distractor_"+idx, label:label }));
      const chipList = shuffled(realChips.concat(distractorChipsList));
      /* chipStyle "strategy": statt eines Text-Chips (Wort) wird ein runder Farbkreis mit dem
         Strategie-Symbol angezeigt - das Wort selbst steht ja schon (alwaysLabel) auf der Kachel. */
      /* q.chipLabels: optionale Zuordnung value -> Chip-Text, falls der Chip etwas ANDERES zeigen
         soll als die Kachel selbst (z.B. Kachel zeigt ein Merkmal, Chip zeigt den Gruppennamen). */
      const chipsHtml = chipList.map((chip,idx) => {
        if (q.chipStyle === "strategy"){
          const meta = STRATEGY_META[chip.value];
          return `<button type="button" class="mm-chip mm-chip-badge" style="background:${meta ? meta.color : "#999"}" data-value="${esc(chip.value)}" id="chip_${idx}" title="${meta ? esc(meta.label) : ""}">${strategyIconPlateHtml(chip.value)}</button>`;
        }
        const chipLabel = (q.chipLabels && q.chipLabels[chip.value]) || chip.label;
        return `<button type="button" class="mm-chip" data-value="${esc(chip.value)}" id="chip_${idx}">${esc(chipLabel)}</button>`;
      }).join("");
      const hint = q.chipStyle === "strategy"
        ? "Tippe ein Symbol an, halte es gedrückt und ziehe es auf das passende Wort."
        : "Tippe ein Wort an, halte es gedrückt und ziehe es auf die passende Kachel.";
      body = mmBoardHtml(q, false) + `
        <p class="gap-hint">${hint}</p>
        <div class="chip-tray" id="chipTray">${chipsHtml}</div>
      `;
    } else if (q.kind === "text"){
      body = `
        <div class="numeric-row">
          <input type="text" class="numeric-input" id="textInput" placeholder="${esc(q.placeholder || "Antwort eintippen")}" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">
          <button class="check-btn" id="checkBtn">Prüfen</button>
        </div>
      `;
    } else if (q.kind === "circle-sort"){
      /* 5 immer sichtbare Strategie-Kreise, kreisförmig (Fünfeck) um das Wort in der Mitte
         verteilt; die Wörter aus q.items erscheinen eines nach dem anderen und werden in die Mitte
         gezogen - siehe Event-Wiring unten. Läuft komplett im Vollbild (siehe host.innerHTML unten). */
      const circleOrder = ["ableiten","schwingen","merken","grossklein","verlaengern"];
      /* Auf dem kleinen Kreis selbst steht eine kurze Beschriftung (Platzgrund) - der volle Name
         ("Groß- oder Kleinschreibung") bleibt überall sonst in der App unverändert. */
      const circleShortLabel = { grossklein: "Groß-/Klein" };
      const circlesHtml = circleOrder.map((key, idx) => {
        const meta = STRATEGY_META[key];
        /* Fünfeck: erster Kreis oben (12 Uhr), dann im Uhrzeigersinn alle 72°. */
        const angle = (-90 + idx * 72) * Math.PI / 180;
        const leftPct = (50 + 40 * Math.cos(angle)).toFixed(2);
        const topPct = (50 + 40 * Math.sin(angle)).toFixed(2);
        return `<div class="cs-circle" data-id="${key}" style="background:${meta.color}; left:${leftPct}%; top:${topPct}%;">
          ${strategyIconPlateHtml(key)}
          <span class="cs-circle-label">${esc(circleShortLabel[key] || meta.label)}</span>
        </div>`;
      }).join("");
      body = `
        <div class="cs-fs-stage">
          <div id="csCircles">${circlesHtml}</div>
          <div class="cs-word" id="csWord"></div>
        </div>
      `;
    } else if (q.kind === "wordsearch"){
      /* Buchstabengitter: Zellen anklicken (erste Zelle, dann letzte Zelle eines Wortes -
         waagrecht oder senkrecht). Die gesuchten Begriffe werden NICHT vorab genannt (wie im
         Original-Arbeitsblatt) - die Schüler müssen selbst erkennen, welche Begriffe zum Thema
         passen. Gefundene Wörter erscheinen erst danach in der Liste unten. */
      const cellsHtml = q.grid.map((rowStr, r) => rowStr.split("").map((ch, c) =>
        `<button type="button" class="ws-cell" data-r="${r}" data-c="${c}">${esc(ch)}</button>`
      ).join("")).join("");
      body = `
        <p class="ws-instruction">👉 So geht's: Tippe den <strong>ersten</strong> und danach den <strong>letzten</strong> Buchstaben eines Begriffs an (waagrecht oder senkrecht) – dazwischen wird automatisch markiert.</p>
        <div class="ws-board" id="wsBoard" style="grid-template-columns:repeat(${q.cols},1fr);">${cellsHtml}</div>
        <div class="ws-progress" id="wsProgress">0 von ${q.words.length} Begriffen gefunden</div>
        <div class="ws-found" id="wsFound"></div>
      `;
    } else if (q.kind === "gapfill"){
      /* Lückentext: q.template enthält "%%" als Platzhalter für jede Lücke (in Reihenfolge),
         q.answers das passende Lösungswort je Lücke (gleiche Reihenfolge); "¶" im Template erzeugt
         einen Absatzumbruch. q.typeIn (optional): Wörter werden getippt statt aus einer Wortliste
         angetippt - siehe Event-Wiring q.kind==="gapfill" weiter unten. Ohne q.typeIn bleibt es wie
         bisher: Lücke antippen und danach das passende Wort aus der Liste antippen (oder umgekehrt,
         robuster auf dem iPad als Ziehen). */
      const gapParts = q.template.split("%%");
      if (q.typeIn){
        const textHtml = gapParts.map((seg, idx) =>
          esc(seg).split("¶").join("<br><br>") + (idx < gapParts.length - 1 ? `<input type="text" class="lt-type-input" id="ltInput_${idx}" data-idx="${idx}" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">` : "")
        ).join("");
        body = `
          <p class="ws-instruction">👉 Tippe die fehlenden Wörter in die Lücken – nutze dazu den Text im Buch.</p>
          <div class="lt-text" id="ltText">${textHtml}</div>
          <div class="qactions" style="margin-top:0;"><button class="check-btn" id="checkBtn">Prüfen</button></div>
        `;
      } else {
        const textHtml = gapParts.map((seg, idx) =>
          esc(seg) + (idx < gapParts.length - 1 ? `<button type="button" class="lt-blank" data-idx="${idx}"></button>` : "")
        ).join("");
        /* q.extraWords (optional): zusätzliche Ablenkwörter in der Wortliste, passen in keine Lücke. */
        const bankWords = shuffled(q.answers.map((w,idx)=>({word:w, idx})).concat((q.extraWords||[]).map(w=>({word:w, idx:-1}))));
        const chipsHtml = bankWords.map((item,i) => `<button type="button" class="lt-chip" data-word="${esc(item.word)}" id="ltChip_${i}">${esc(item.word)}</button>`).join("");
        body = `
          <p class="ws-instruction">👉 Tippe eine Lücke an und danach das passende Wort aus der Liste – oder umgekehrt.</p>
          <div class="lt-text" id="ltText">${textHtml}</div>
          <div class="lt-wordbank" id="ltWordbank">${chipsHtml}</div>
        `;
      }
    } else if (q.kind === "table-match"){
      /* Tabelle ausfüllen: linke Spalte(n) fest vorgegeben, rechte Spalte(n) mit Lücken-Kärtchen
         (ein oder - bei Aufgabe 4 - zwei Kärtchen je Zeile, siehe row.accept.length). Bedienung wie
         beim Lückentext: Lücke antippen und danach das passende Kärtchen aus der Bank antippen -
         oder umgekehrt. Bewusst mehr Kärtchen in der Bank als Lücken (Distraktoren in q.chips ohne
         passende Zeile), damit nicht einfach nach Ausschlussprinzip geraten werden kann. */
      const rowsHtml = q.rows.map((row, rIdx) => {
        const slotsHtml = row.accept.map((_, sIdx) =>
          `<button type="button" class="tm-blank" data-row="${rIdx}" data-slot="${sIdx}"></button>`
        ).join("");
        return `<tr><td class="tm-given">${esc(row.label)}</td><td class="tm-answer">${slotsHtml}</td></tr>`;
      }).join("");
      const chipList = shuffled(q.chips.map((c,idx) => ({ ...c, idx })));
      const chipsHtml = chipList.map((chip,i) => `<button type="button" class="lt-chip" data-chip-id="${esc(chip.id)}" id="tmChip_${i}">${esc(chip.label)}</button>`).join("");
      body = `
        <p class="ws-instruction">👉 Tippe eine Lücke in der Tabelle an und danach das passende Kärtchen aus der Liste – oder umgekehrt.</p>
        <table class="tm-table" id="tmTable">
          <thead><tr><th>${esc(q.columns[0])}</th><th>${esc(q.columns[1])}</th></tr></thead>
          <tbody>${rowsHtml}</tbody>
        </table>
        <div class="lt-wordbank" id="tmWordbank">${chipsHtml}</div>
      `;
    } else {
      body = `
        <div class="options" id="opts">
          ${q.options.map((o,idx)=>`<button class="option" data-idx="${idx}">${esc(o)}</button>`).join("")}
        </div>
      `;
    }

    if (q.kind === "circle-sort"){
      /* Eigenes Vollbild-Layout statt der normalen .qcard: legt sich über die gesamte Seite
         (Kopf/Fortschrittsleiste werden dabei überdeckt), Fortschritt+Hinweis oben, Bühne mit
         Wort+Kreisen in der Mitte, Feedback/Buttons unten - alles in einem festen Rahmen. */
      host.innerHTML = `
        <div class="cs-fullscreen">
          <div class="cs-fs-top">
            <div class="cs-progress" id="csProgress">Wort 1 von ${q.items.length}</div>
            <p class="cs-fs-hint">${esc(q.text)}</p>
          </div>
          ${body}
          <div class="feedback" id="fb"></div>
          <div class="qactions">
            <button class="skip-btn" id="skipBtn">Überspringen</button>
            <button class="next-btn" id="nextBtn">${i+1===total ? "Ergebnis ansehen" : "Weiter"}</button>
          </div>
        </div>
      `;
    } else if (q.kind === "map-match" && (q.mapType === "de-states" || q.mapType === "de-nachbarn" || q.mapType === "bayern-regionen" || q.mapType === "bayern-fluesse" || q.mapType === "bayern-staedte")){
      /* Ebenfalls Vollbild (siehe .mm-fullscreen oben): die Karte bekommt per flex:1+min-height:0
         nur den Platz, der nach Hinweistext und Chip-Leiste übrig bleibt, und schrumpft darin -
         so bleiben Karte UND alle Chips immer gleichzeitig sichtbar, auch auf kleinen/niedrigen
         Bildschirmen, wo das vorher nicht der Fall war (Chips konnten unerreichbar außerhalb des
         sichtbaren Bereichs landen, weil man während des Ziehens nicht scrollen kann). */
      host.innerHTML = `
        <div class="mm-fullscreen">
          <div class="mm-fs-top">
            <p class="mm-fs-hint">${esc(q.text)}</p>
          </div>
          <div class="mm-fs-stage">${body}</div>
          ${mmTrayHtml}
          <div class="feedback" id="fb"></div>
          <div class="qactions">
            <button class="skip-btn" id="skipBtn">Überspringen</button>
            <button class="next-btn" id="nextBtn">${i+1===total ? "Ergebnis ansehen" : "Weiter"}</button>
          </div>
        </div>
      `;
    } else if (q.kind === "table-match"){
      /* Bewusst OHNE Überspringen-Button: laut Vorgabe gilt diese Aufgabe erst als fertig, wenn die
         Tabelle vollständig richtig ausgefüllt ist. lockQuestion() blendet bei anderen Aufgabentypen
         einen vorhandenen skipBtn aus (siehe dort, mit if-Check) - hier gibt es first gar keinen. */
      host.innerHTML = `
        <div class="qcard">
          ${head(q)}
          ${body}
          <div class="feedback" id="fb"></div>
          <div class="qactions">
            <button class="next-btn" id="nextBtn">${i+1===total ? "Ergebnis ansehen" : "Weiter"}</button>
          </div>
        </div>
      `;
    } else {
      /* q.noSkip: bei manchen Aufgaben (z.B. Rechenaufgaben zur Bakterien-Vermehrung) soll die
         Lösung nicht durch Überspringen sichtbar werden - dann fehlt der Button hier ganz, genau
         wie beim table-match oben. Die addEventListener-Aufrufe weiter unten prüfen deshalb jeweils
         erst, ob der Button überhaupt existiert. */
      const skipBtnHtml = q.noSkip ? "" : `<button class="skip-btn" id="skipBtn">Überspringen</button>`;
      host.innerHTML = `
        <div class="qcard">
          ${head(q)}
          ${body}
          <div class="feedback" id="fb"></div>
          <div class="qactions">
            ${skipBtnHtml}
            <button class="next-btn" id="nextBtn">${i+1===total ? "Ergebnis ansehen" : "Weiter"}</button>
          </div>
        </div>
      `;
    }

    if (q.kind === "numeric"){
      const input = document.getElementById("numInput");
      const check = ()=>{
        if (solved) return;
        attempts++;
        const val = normalizeAnswer(input.value);
        const ok = q.accept.some(a => normalizeAnswer(a) === val) && val !== "";
        if (ok){
          input.disabled = true;
          document.getElementById("checkBtn").disabled = true;
          input.parentElement.classList.add("correct");
          lockQuestion("correct", q.explain, "correct");
        } else {
          tryAgainFeedback();
          input.select();
        }
      };
      document.getElementById("checkBtn").addEventListener("click", check);
      input.addEventListener("keydown", e=>{ if (e.key === "Enter") check(); });
      const skipBtn = document.getElementById("skipBtn");
      if (skipBtn) skipBtn.addEventListener("click", ()=>{
        if (solved) return;
        input.disabled = true;
        document.getElementById("checkBtn").disabled = true;
        input.value = q.accept[0];
        input.parentElement.classList.add("wrong");
        lockQuestion("skipped", "Nicht gelöst.", "wrong");
      });
    } else if (q.kind === "text"){
      const input = document.getElementById("textInput");
      /* q.strict: bei manchen Fragen (z.B. "wie heißt diese Strategie?") soll die Schreibweise
         wirklich zählen - dann NICHT klein schreiben, nur Leerzeichen am Rand/doppelte Leerzeichen
         tolerieren. Ohne q.strict bleibt es wie bisher groß-/kleinschreibungs-unabhängig. */
      const normalizeText = s => {
        const t = String(s).trim().replace(/\s+/g," ");
        return q.strict ? t : t.toLowerCase();
      };
      const check = ()=>{
        if (solved) return;
        attempts++;
        const val = normalizeText(input.value);
        const ok = val !== "" && q.accept.some(a => normalizeText(a) === val);
        if (ok){
          input.disabled = true;
          document.getElementById("checkBtn").disabled = true;
          input.parentElement.classList.add("correct");
          lockQuestion("correct", q.explain, "correct");
        } else {
          tryAgainFeedback();
          input.select();
        }
      };
      document.getElementById("checkBtn").addEventListener("click", check);
      input.addEventListener("keydown", e=>{ if (e.key === "Enter") check(); });
      const skipBtn = document.getElementById("skipBtn");
      if (skipBtn) skipBtn.addEventListener("click", ()=>{
        if (solved) return;
        input.disabled = true;
        document.getElementById("checkBtn").disabled = true;
        input.value = q.accept[0];
        input.parentElement.classList.add("wrong");
        lockQuestion("skipped", "Nicht gelöst.", "wrong");
      });
    } else if (q.kind === "grid-shade"){
      const grid = document.getElementById("shadeGrid");
      const countEl = document.getElementById("shadeCount");
      const target = Math.round(q.rows*q.cols*q.targetPercent/100);
      let shaded = new Set();

      /* Zum Ausmalen: mit dem Finger/Stift über mehrere Kästchen ziehen statt
         jedes einzeln antippen zu müssen. Die erste berührte Zelle bestimmt den
         Modus (Farbe an- oder ausschalten); beim Ziehen darüber wird derselbe
         Modus auf jede neu erreichte Zelle angewendet. */
      let painting = false;
      let paintOn = true;

      function paintCell(cell, on){
        if (!cell || solved) return;
        const idx = cell.dataset.i;
        if (on && !shaded.has(idx)){ shaded.add(idx); cell.classList.add("on"); }
        else if (!on && shaded.has(idx)){ shaded.delete(idx); cell.classList.remove("on"); }
        countEl.textContent = shaded.size;
      }

      function cellAt(clientX, clientY){
        const el = document.elementFromPoint(clientX, clientY);
        const cell = el && el.closest(".shade-cell");
        return (cell && grid.contains(cell)) ? cell : null;
      }

      grid.addEventListener("pointerdown", (e)=>{
        if (solved) return;
        const cell = e.target.closest(".shade-cell");
        if (!cell) return;
        e.preventDefault();
        painting = true;
        paintOn = !shaded.has(cell.dataset.i);
        paintCell(cell, paintOn);
      });
      grid.addEventListener("pointermove", (e)=>{
        if (!painting) return;
        e.preventDefault();
        paintCell(cellAt(e.clientX, e.clientY), paintOn);
      });
      const stopPainting = ()=>{ painting = false; };
      window.addEventListener("pointerup", stopPainting);
      window.addEventListener("pointercancel", stopPainting);

      document.getElementById("checkBtn").addEventListener("click", ()=>{
        if (solved) return;
        attempts++;
        const ok = shaded.size === target;
        if (ok){
          document.getElementById("checkBtn").disabled = true;
          lockQuestion("correct", q.explain, "correct");
        } else {
          tryAgainFeedback(`Leider falsch (du hast ${shaded.size} statt ${target} Kästchen gefärbt) – versuch's nochmal.`);
        }
      });
      const skipBtn = document.getElementById("skipBtn");
      if (skipBtn) skipBtn.addEventListener("click", ()=>{
        if (solved) return;
        document.getElementById("checkBtn").disabled = true;
        grid.querySelectorAll(".shade-cell").forEach(c=>c.style.pointerEvents="none");
        grid.querySelectorAll(".shade-cell").forEach((cell,idx)=>{ if (idx < target) cell.classList.add("target"); });
        lockQuestion("skipped", "Nicht gelöst.", "wrong");
      });
    } else if (q.kind === "click-gap"){
      const sentence = document.getElementById("gapSentence");
      const active = new Set();
      const correctSet = new Set(q.gaps.map(String));
      sentence.querySelectorAll(".gap-slot").forEach(btn=>{
        btn.addEventListener("click", ()=>{
          if (solved) return;
          const g = btn.dataset.g;
          if (active.has(g)){ active.delete(g); btn.classList.remove("active"); }
          else { active.add(g); btn.classList.add("active"); }
        });
      });
      document.getElementById("checkBtn").addEventListener("click", ()=>{
        if (solved) return;
        attempts++;
        const ok = active.size === correctSet.size && [...active].every(g => correctSet.has(g));
        if (ok){
          document.getElementById("checkBtn").disabled = true;
          sentence.querySelectorAll(".gap-slot").forEach(b=>{ b.disabled = true; });
          lockQuestion("correct", q.explain, "correct");
        } else {
          tryAgainFeedback();
        }
      });
      const skipBtn = document.getElementById("skipBtn");
      if (skipBtn) skipBtn.addEventListener("click", ()=>{
        if (solved) return;
        document.getElementById("checkBtn").disabled = true;
        sentence.querySelectorAll(".gap-slot").forEach(b=>{
          b.disabled = true;
          if (correctSet.has(b.dataset.g)) b.classList.add("target","active");
        });
        lockQuestion("skipped", "Nicht gelöst.", "wrong");
      });
    } else if (q.kind === "map-select" && q.mapType === "de-states"){
      const map = document.getElementById("deMap");
      map.querySelectorAll(".de-tile[data-target]").forEach(tile=>{
        tile.addEventListener("click", ()=>{
          if (solved) return;
          attempts++;
          if (tile.dataset.id === q.correctId){
            tile.classList.add("correct");
            revealTileLabel(tile);
            lockQuestion("correct", q.explain, "correct");
          } else {
            tile.classList.add("wrong-flash");
            setTimeout(()=>tile.classList.remove("wrong-flash"), 450);
            tryAgainFeedback();
          }
        });
      });
      const skipBtn = document.getElementById("skipBtn");
      if (skipBtn) skipBtn.addEventListener("click", ()=>{
        if (solved) return;
        map.querySelectorAll(".de-tile[data-target]").forEach(t=>{ t.style.pointerEvents = "none"; });
        const correctTile = map.querySelector('.de-tile[data-id="'+q.correctId+'"]');
        if (correctTile){
          correctTile.classList.add("correct");
          revealTileLabel(correctTile);
        }
        lockQuestion("skipped", "Nicht gelöst.", "wrong");
      });
    } else if (q.kind === "map-select"){
      const board = document.getElementById("mmBoard");
      board.querySelectorAll(".mm-tile[data-target]").forEach(tile=>{
        tile.addEventListener("click", ()=>{
          if (solved) return;
          attempts++;
          if (tile.dataset.id === q.correctId){
            tile.classList.add("correct");
            tile.innerHTML = `<span class="mm-label">${esc(tile.dataset.label)}</span>`;
            lockQuestion("correct", q.explain, "correct");
          } else {
            tile.classList.add("wrong-flash");
            setTimeout(()=>tile.classList.remove("wrong-flash"), 450);
            tryAgainFeedback();
          }
        });
      });
      const skipBtn = document.getElementById("skipBtn");
      if (skipBtn) skipBtn.addEventListener("click", ()=>{
        if (solved) return;
        board.querySelectorAll(".mm-tile[data-target]").forEach(t=>{ t.style.pointerEvents = "none"; });
        const correctTile = board.querySelector('.mm-tile[data-id="'+q.correctId+'"]');
        if (correctTile){
          correctTile.classList.add("correct");
          correctTile.innerHTML = `<span class="mm-label">${esc(correctTile.dataset.label)}</span>`;
        }
        lockQuestion("skipped", "Nicht gelöst.", "wrong");
      });
    } else if (q.kind === "map-match" && (q.mapType === "de-states" || q.mapType === "de-nachbarn" || q.mapType === "bayern-regionen" || q.mapType === "bayern-fluesse" || q.mapType === "bayern-staedte")){
      /* Gemeinsame Logik für beide echten Karten (Bundesländer und Nachbarländer) - beide rendern
         dieselbe DOM-Struktur (#deMap, .de-tile), daher reicht eine Bedingung für beide mapTypes. */
      const map = document.getElementById("deMap");
      const tray = document.getElementById("chipTray");
      let draggedChip = null, ghost = null, draggedPointerId = null;

      function moveGhost(x,y){ if (ghost){ ghost.style.left = x+"px"; ghost.style.top = y+"px"; } }
      function endGhost(){ if (ghost){ ghost.remove(); ghost = null; } }
      /* Setzt den Drag-Zustand komplett zurück - genutzt sowohl bei einem normalen Loslassen als
         auch bei "pointercancel" (siehe unten). WICHTIG: ohne pointercancel-Behandlung blieb
         draggedChip auf iPads manchmal "hängen", wenn iOS eine Wischgeste als Scrollen statt als
         Ziehen interpretiert hat (kein pointerup, nur pointercancel) - der nächste, völlig
         unabhängige Tipp irgendwo auf der Seite wurde dann fälschlich als Loslassen DIESES Chips
         gewertet und hat ihn auf ein zufälliges Bundesland gesetzt. Genau das hat dazu geführt,
         dass beim Ziehen eines Namens auf einen Platz später "irgendwie" derselbe (oder ein
         anderer) Name auf einer ganz anderen Fläche gelandet ist. */
      function resetDrag(){
        if (draggedChip) draggedChip.classList.remove("dragging");
        draggedChip = null;
        draggedPointerId = null;
        endGhost();
      }

      function checkComplete(){
        if (map.querySelectorAll('.de-tile[data-target]:not(.correct)').length === 0){
          const skipBtn = document.getElementById("skipBtn");
          if (skipBtn) skipBtn.style.display = "none";
          lockQuestion("correct", q.explain, "correct");

      }

      tray.querySelectorAll(".mm-chip").forEach(chip=>{
        chip.addEventListener("pointerdown", (e)=>{
          /* "|| draggedChip": solange schon ein Chip gezogen wird, wird ein zweiter, gleichzeitiger
             Finger (z.B. beim Halten des iPads) ignoriert, statt den ersten Zug verwaist zurückzulassen. */
          if (solved || chip.classList.contains("used") || draggedChip) return;
          e.preventDefault();
          draggedChip = chip;
          draggedPointerId = e.pointerId;
          chip.classList.add("dragging");
          ghost = document.createElement("div");
          ghost.className = "mm-chip-ghost";
          ghost.textContent = chip.textContent;
          document.body.appendChild(ghost);
          moveGhost(e.clientX, e.clientY);
          try { chip.setPointerCapture(e.pointerId); } catch(err){ /* ignorieren */ }
        });

      window.addEventListener("pointermove", (e)=>{
        if (draggedChip && e.pointerId === draggedPointerId) moveGhost(e.clientX, e.clientY);
      });
      window.addEventListener("pointerup", (e)=>{
        if (!draggedChip || e.pointerId !== draggedPointerId) return;
        const chip = draggedChip;

          tile.classList.add("correct");

          chip.classList.add("used");
          checkComplete();

          tile.classList.add("wrong-flash");
          setTimeout(()=>tile.classList.remove("wrong-flash"), 450);

      window.addEventListener("pointercancel", (e)=>{
        if (draggedChip && e.pointerId === draggedPointerId) resetDrag();

      const skipBtn = document.getElementById("skipBtn");
      if (skipBtn) skipBtn.addEventListener("click", ()=>{
        if (solved) return;
        map.querySelectorAll('.de-tile[data-target]').forEach(tile=>{ tile.classList.add("correct"); revealTileLabel(tile); });
        tray.querySelectorAll(".mm-chip").forEach(c=>c.classList.add("used"));

    } else if (q.kind === "map-match"){
      const board = document.getElementById("mmBoard");
      const tray = document.getElementById("chipTray");
      let draggedChip = null, ghost = null, draggedPointerId = null;

      /* matchBy:"group": Reihenfolge innerhalb einer Spalte/Gruppe spielt keine Rolle - ein Chip
         darf auf JEDES freie Feld seiner eigenen Gruppe gezogen werden, nicht nur auf das eine,
         vorher fest zugeordnete Feld. originGroupById übersetzt den Chip-Wert (= id der Kachel,
         von der der Chip-Text stammt) in deren Gruppe, damit sich das mit der Zielkachel
         vergleichen lässt. */
      const originGroupById = {};
      if (q.matchBy === "group"){
        q.tiles.forEach(t => { if (t.group) originGroupById[t.id] = t.group; });
      }

      function moveGhost(x,y){ if (ghost){ ghost.style.left = x+"px"; ghost.style.top = y+"px"; } }
      function endGhost(){ if (ghost){ ghost.remove(); ghost = null; } }
      /* Siehe ausführlicher Kommentar bei der Bundesländer/Nachbarländer-Karte weiter oben: ohne

         die Geste z.B. als Scrollen) dazu führen, dass ein späterer, unabhängiger Tipp den alten
         Chip auf ein falsches Feld setzt. */
      function resetDrag(){

        draggedChip = null;
        draggedPointerId = null;
        endGhost();
      }

      function checkComplete(){
        if (board.querySelectorAll('.mm-tile[data-target]:not(.correct)').length === 0){
          const skipBtn = document.getElementById("skipBtn");
          if (skipBtn) skipBtn.style.display = "none";
          lockQuestion("correct", q.explain, "correct");
        }
      }

      tray.querySelectorAll(".mm-chip").forEach(chip=>{
        chip.addEventListener("pointerdown", (e)=>{
          if (solved || chip.classList.contains("used") || draggedChip) return;
          e.preventDefault();
          draggedChip = chip;
          draggedPointerId = e.pointerId;
          chip.classList.add("dragging");
          ghost = document.createElement("div");
          const isBadge = chip.classList.contains("mm-chip-badge");
          ghost.className = "mm-chip-ghost" + (isBadge ? " mm-chip-ghost-badge" : "");
          if (isBadge){ ghost.style.background = chip.style.background; ghost.innerHTML = chip.innerHTML; }
          else { ghost.textContent = chip.textContent; }
          document.body.appendChild(ghost);
          moveGhost(e.clientX, e.clientY);
          try { chip.setPointerCapture(e.pointerId); } catch(err){ /* ignorieren */ }

      window.addEventListener("pointermove", (e)=>{
        if (draggedChip && e.pointerId === draggedPointerId) moveGhost(e.clientX, e.clientY);
      });
      window.addEventListener("pointerup", (e)=>{
        if (!draggedChip || e.pointerId !== draggedPointerId) return;
        const chip = draggedChip;
        resetDrag();
        if (solved) return;
        const el = document.elementFromPoint(e.clientX, e.clientY);
        const tile = el && el.closest ? el.closest(".mm-tile[data-target]") : null;
        if (!tile || tile.classList.contains("correct")) return;
        attempts++;
        const isMatch = q.matchBy === "group"
          ? !!tile.dataset.group && tile.dataset.group === originGroupById[chip.dataset.value]
          : tile.dataset.id === chip.dataset.value;
        if (isMatch){
          tile.classList.add("correct");
          /* Bei Gruppen-Zuordnung landet der Chip evtl. auf einer ANDEREN Kachel als ursprünglich
             vorgesehen - deshalb hier genau den gezogenen Chip-Text anzeigen, nicht die
             vorbelegte dataset.label der Kachel. */
          const labelHtml = q.matchBy === "group"
            ? esc(chip.textContent)
            : highlightLabel(tile.dataset.label, tile.dataset.mark);
          tile.innerHTML = (tile.dataset.icon ? `<span class="mm-icon">${tile.dataset.icon}</span>` : "") + `<span class="mm-label">${labelHtml}</span>`;
          chip.classList.add("used");
          /* Verschachtelte Kreis-Zuordnung: der dekorative große Kreis färbt sich erst jetzt ein
             (siehe CSS-Kommentar bei ".nc-board") - bei allen anderen map-match-Übungen ist
             data-fill-target einfach nicht gesetzt, ändert also nichts. */
          if (tile.dataset.fillTarget){
            const wrap = document.getElementById(tile.dataset.fillTarget);
            if (wrap) wrap.classList.add("filled");

          checkComplete();
        } else {
          tile.classList.add("wrong-flash");
          setTimeout(()=>tile.classList.remove("wrong-flash"), 450);
          tryAgainFeedback();
        }
      });
      window.addEventListener("pointercancel", (e)=>{
        if (draggedChip && e.pointerId === draggedPointerId) resetDrag();
      });
      const skipBtn = document.getElementById("skipBtn");
      if (skipBtn) skipBtn.addEventListener("click", ()=>{
        if (solved) return;
        board.querySelectorAll('.mm-tile[data-target]').forEach(tile=>{
          tile.classList.add("correct");
          tile.innerHTML = (tile.dataset.icon ? `<span class="mm-icon">${tile.dataset.icon}</span>` : "") + `<span class="mm-label">${highlightLabel(tile.dataset.label, tile.dataset.mark)}</span>`;

        lockQuestion("skipped", "Nicht gelöst.", "wrong");

    } else if (q.kind === "circle-sort"){
      const wordEl = document.getElementById("csWord");
      const progressEl = document.getElementById("csProgress");
      const itemsTotal = q.items.length;
      let pos = 0;
      let dragging = false, ghost = null, draggedPointerId = null;

      function renderWord(){

      function moveGhost(x,y){ if (ghost){ ghost.style.left = x+"px"; ghost.style.top = y+"px"; } }
      function endGhost(){ if (ghost){ ghost.remove(); ghost = null; } }
      /* Siehe Kommentar bei der Bundesländer-Karte weiter oben: pointercancel/pointerId-Prüfung
         verhindert, dass ein abgebrochener Zug später einen unabhängigen Tipp als Loslassen wertet. */
      function resetDrag(){
        dragging = false;
        draggedPointerId = null;
        wordEl.classList.remove("dragging");

      }

      wordEl.addEventListener("pointerdown", (e)=>{
        if (solved || dragging) return;

        dragging = true;
        draggedPointerId = e.pointerId;
        wordEl.classList.add("dragging");
        ghost = document.createElement("div");
        ghost.className = "cs-word-ghost";

      });

        if (dragging && e.pointerId === draggedPointerId) moveGhost(e.clientX, e.clientY);
      });
      window.addEventListener("pointerup", (e)=>{
        if (!dragging || e.pointerId !== draggedPointerId) return;
        resetDrag();
        if (solved) return;
        const el = document.elementFromPoint(e.clientX, e.clientY);
        const circle = el && el.closest ? el.closest(".cs-circle") : null;
        if (!circle) return;
        attempts++;
        if (circle.dataset.id === wordEl.dataset.id){
          circle.classList.add("correct-flash");

      });
    } else if (q.kind === "wordsearch"){
      const board = document.getElementById("wsBoard");
      const progressEl = document.getElementById("wsProgress");
      const foundEl = document.getElementById("wsFound");
      const total2 = q.words.length;
      let found = 0;
      let start = null; // {r,c,btn}

      function cellKey(r,c){ return r + "_" + c; }
      function cellBtn(r,c){ return board.querySelector(`.ws-cell[data-r="${r}"][data-c="${c}"]`); }
      function pathBetween(r1,c1,r2,c2){
        if (r1 === r2){
          const lo = Math.min(c1,c2), hi = Math.max(c1,c2);
          const cells = [];
          for (let c=lo;c<=hi;c++) cells.push([r1,c]);
          return cells;
        }
        if (c1 === c2){
          const lo = Math.min(r1,r2), hi = Math.max(r1,r2);
          const cells = [];
          for (let r=lo;r<=hi;r++) cells.push([r,c1]);
          return cells;
        }
        return null;
      }
      function sameCells(a, b){
        if (a.length !== b.length) return false;
        const setA = new Set(a.map(([r,c])=>cellKey(r,c)));
        return b.every(([r,c])=>setA.has(cellKey(r,c)));
      }
      function updateProgress(){
        progressEl.textContent = `${found} von ${total2} Begriffen gefunden`;
      }
      function markWordFound(wordDef){
        wordDef.cells.forEach(([r,c])=>{
          const btn = cellBtn(r,c);
          if (btn){ btn.classList.remove("selected"); btn.classList.add("found"); }
        });
        found++;
        updateProgress();
        const chip = document.createElement("span");
        chip.className = "ws-found-chip";
        chip.textContent = wordDef.word;
        foundEl.appendChild(chip);
        if (found >= total2){
          lockQuestion("correct", q.explain, "correct");
        }
      }
      board.querySelectorAll(".ws-cell").forEach(btn=>{
        btn.addEventListener("click", ()=>{
          if (solved) return;
          const r = Number(btn.dataset.r), c = Number(btn.dataset.c);
          if (!start){
            start = { r, c, btn };
            btn.classList.add("selected");
            return;
          }
          if (start.r === r && start.c === c){
            btn.classList.remove("selected");
            start = null;
            return;
          }
          const path = pathBetween(start.r, start.c, r, c);
          const startBtn = start.btn;
          start = null;
          if (!path){
            startBtn.classList.remove("selected");
            tryAgainFeedback("Das ist nicht waagrecht oder senkrecht.");
            return;
          }
          attempts++;
          const match = q.words.find(w => !w.__found && sameCells(w.cells, path));
          if (match){
            match.__found = true;
            markWordFound(match);
            startBtn.classList.remove("selected");
          } else {
            const flashBtns = path.map(([rr,cc])=>cellBtn(rr,cc));
            flashBtns.forEach(b=>b && b.classList.add("wrong-flash"));
            startBtn.classList.remove("selected");
            tryAgainFeedback();
            setTimeout(()=>flashBtns.forEach(b=>b && b.classList.remove("wrong-flash")), 450);
          }
        });
      });
      const skipBtn = document.getElementById("skipBtn");
      if (skipBtn) skipBtn.addEventListener("click", ()=>{
        if (solved) return;
        q.words.forEach(w=>{
          if (!w.__found){
            w.__found = true;
            w.cells.forEach(([r,c])=>{
              const btn = cellBtn(r,c);
              if (btn) btn.classList.add("found");
            });
            const chip = document.createElement("span");
            chip.className = "ws-found-chip";
            chip.textContent = w.word;
            foundEl.appendChild(chip);
          }
        });
        lockQuestion("skipped", "Nicht gelöst.", "wrong");
      });
    } else if (q.kind === "gapfill" && q.typeIn){
      /* Getippte Lücken: ein <input> je Lücke, ein gemeinsamer "Prüfen"-Button kontrolliert alle auf
         einmal (wie bei grid-shade/click-gap). Falsch beantwortete Lücken bleiben editierbar für
         einen neuen Versuch, schon richtige werden gesperrt. q.strict: Groß-/Kleinschreibung zählt
         (gleiches Verhalten wie beim "text"-Aufgabentyp). */
      const inputs = [...document.querySelectorAll(".lt-type-input")];
      const normalize = s => {
        const t = String(s).trim().replace(/\s+/g," ");
        return q.strict ? t : t.toLowerCase();
      };
      /* Lücken wachsen beim Tippen mit, damit lange Wörter (z.B. "Geflügelbetriebe") nicht
         abgeschnitten werden - Breite in "ch" (Zeichenbreite), Mindestbreite über die CSS-Regel. */
      const autoSize = input => { input.style.width = Math.max(8, input.value.length + 2) + "ch"; };
      inputs.forEach(autoSize);
      const checkBtn = document.getElementById("checkBtn");
      /* Pop-up nach vollständig richtigem Lückentext zeigt nicht nur eine Anweisung, sondern einen
         eigenen kürzeren Text zum Abschreiben (q.popupBody, z.B. ein kurzer Merksatz/Vergleich) -
         das ist bewusst ein ANDERER, kürzerer Text als der Lückentext selbst (q.template), nicht
         einfach der ausgefüllte Lückentext. q.popupText ist die Überschrift darüber; "¶" in
         q.popupBody trennt Absätze. */
      const showPopup = ()=>{
        if (!q.popupText || !q.popupBody) return;
        const paragraphsHtml = q.popupBody.split("¶").map(p => `<p>${esc(p.trim())}</p>`).join("");
        const overlay = document.createElement("div");
        overlay.className = "tm-popup-overlay";
        overlay.innerHTML = `<div class="tm-popup-card text-content"><h3>${esc(q.popupText)}</h3>${paragraphsHtml}<button type="button" class="tm-popup-close">Schließen</button></div>`;
        document.body.appendChild(overlay);
        overlay.querySelector(".tm-popup-close").addEventListener("click", ()=> overlay.remove());
      };
      const check = ()=>{
        if (solved) return;
        attempts++;
        let allCorrect = true;
        inputs.forEach((input, idx)=>{
          if (input.disabled) return; // schon vorher richtig beantwortet
          const ok = input.value.trim() !== "" && normalize(input.value) === normalize(q.answers[idx]);
          if (ok){
            input.disabled = true;
            input.classList.remove("wrong");
            input.classList.add("correct");
          } else {
            allCorrect = false;
            input.classList.add("wrong");
          }
        });
        if (allCorrect){
          checkBtn.disabled = true;
          lockQuestion("correct", q.explain, "correct");
          showPopup();
        } else {
          tryAgainFeedback();
        }
      };
      checkBtn.addEventListener("click", check);
      inputs.forEach(input=>{
        input.addEventListener("keydown", e=>{ if (e.key === "Enter"){ e.preventDefault(); check(); } });
        input.addEventListener("input", ()=>{ input.classList.remove("wrong"); autoSize(input); });
      });
      const skipBtn = document.getElementById("skipBtn");
      if (skipBtn) skipBtn.addEventListener("click", ()=>{
        if (solved) return;
        inputs.forEach((input, idx)=>{
          input.value = q.answers[idx];
          autoSize(input);
          input.disabled = true;
          input.classList.remove("wrong");
          input.classList.add("correct");
        });
        checkBtn.disabled = true;
        lockQuestion("skipped", "Nicht gelöst.", "wrong");
      });
    } else if (q.kind === "gapfill"){
      /* Antippen statt Ziehen: erst eine Lücke ODER erst ein Wort antippen (Reihenfolge egal -
         wie beim Suchsel), das jeweils andere Element schließt die Auswahl ab und prüft sie. */
      const textEl = document.getElementById("ltText");
      const bankEl = document.getElementById("ltWordbank");
      const total2 = q.answers.length;
      let filledCount = 0;
      let selection = null; // {type:"blank"|"chip", idx?, word?, btn}

      function blankBtn(idx){ return textEl.querySelector(`.lt-blank[data-idx="${idx}"]`); }
      function clearSelection(){

        selection = null;

        setTimeout(()=>el.classList.remove("wrong-flash"), 450);
      }
      function tryMatch(idx, word, chipEl, blankBtnEl){
        attempts++;
        if (q.answers[idx] === word){
          blankBtnEl.textContent = word;
          blankBtnEl.classList.add("correct");
          blankBtnEl.disabled = true;
          chipEl.classList.add("used");
          chipEl.disabled = true;
          filledCount++;
          if (filledCount >= total2){
            lockQuestion("correct", q.explain, "correct");
            /* q.popupText (optional): Pop-up zum Heft-Eintrag nach vollständig richtigem Lückentext
               (gleiches Aussehen wie bei table-match). */
            if (q.popupText){
              bankEl.querySelectorAll(".lt-chip").forEach(c=>{ c.disabled = true; });
              const overlay = document.createElement("div");
              overlay.className = "tm-popup-overlay";
              overlay.innerHTML = `<div class="tm-popup-card"><p>${esc(q.popupText)}</p><button type="button" class="tm-popup-close">Schließen</button></div>`;
              document.body.appendChild(overlay);
              overlay.querySelector(".tm-popup-close").addEventListener("click", ()=> overlay.remove());
            }
          }
        } else {
          flashWrong(blankBtnEl);
          flashWrong(chipEl);
          tryAgainFeedback();
        }
      }
      textEl.querySelectorAll(".lt-blank").forEach(btn=>{
        btn.addEventListener("click", ()=>{
          if (solved || btn.classList.contains("correct")) return;
          const idx = Number(btn.dataset.idx);
          if (selection && selection.type === "chip"){
            const chipEl = selection.btn, word = selection.word;
            clearSelection();
            tryMatch(idx, word, chipEl, btn);
            return;
          }
          if (selection && selection.type === "blank" && selection.idx === idx){
            clearSelection();
            return;
          }
          clearSelection();
          selection = { type:"blank", idx, btn };
          btn.classList.add("active");
        });
      });
      bankEl.querySelectorAll(".lt-chip").forEach(chip=>{
        chip.addEventListener("click", ()=>{
          if (solved || chip.classList.contains("used")) return;
          const word = chip.dataset.word;
          if (selection && selection.type === "blank"){
            const idx = selection.idx, blankBtnEl = selection.btn;
            clearSelection();
            tryMatch(idx, word, chip, blankBtnEl);
            return;
          }
          if (selection && selection.type === "chip" && selection.btn === chip){
            clearSelection();
            return;
          }
          clearSelection();
          selection = { type:"chip", word, btn: chip };
          chip.classList.add("active");
        });
      });
      const skipBtn = document.getElementById("skipBtn");
      if (skipBtn) skipBtn.addEventListener("click", ()=>{
        if (solved) return;
        q.answers.forEach((word, idx)=>{
          const btn = blankBtn(idx);

            btn.textContent = word;
            btn.classList.add("correct");
            btn.disabled = true;

        lockQuestion("skipped", "Nicht gelöst.", "wrong");
      });
    } else if (q.kind === "table-match"){
      /* Gleiche Antippen-Logik wie beim Lückentext (Lücke + Kärtchen, Reihenfolge egal), nur dass
         eine Lücke hier durch (Zeile, Platz) statt durch einen einzelnen Index identifiziert wird -
         bei Aufgabe 4 teilen sich zwei Lücken einer Zeile dieselbe "accept"-Liste (zwei Regionen
         gehören zu einer Kategorie), jedes Kärtchen passt aber nur in eine davon (wird danach
         deaktiviert). KEIN Überspringen (siehe Vollbild-Weiche oben) - lockQuestion() läuft erst,

      const tableEl = document.getElementById("tmTable");
      const bankEl = document.getElementById("tmWordbank");
      const totalBlanks = q.rows.reduce((sum, row) => sum + row.accept.length, 0);
      let filledCount = 0;
      let selection = null; // {type:"blank"|"chip", row?, slot?, chipId?, btn}

      function blankBtn(row, slot){ return tableEl.querySelector(`.tm-blank[data-row="${row}"][data-slot="${slot}"]`); }
      function clearSelection(){

        el.classList.add("wrong-flash");

      }
      function showTablePopup(text){
        const overlay = document.createElement("div");
        overlay.className = "tm-popup-overlay";
        overlay.innerHTML = `
          <div class="tm-popup-card">
            <p>${esc(text)}</p>
            <button type="button" class="tm-popup-close">Schließen</button>
          </div>
        `;
        document.body.appendChild(overlay);
        overlay.querySelector(".tm-popup-close").addEventListener("click", ()=> overlay.remove());
      }
      function tryMatch(row, slot, chipId, chipLabel, chipEl, blankBtnEl){
        attempts++;
        if (q.rows[row].accept.includes(chipId)){
          blankBtnEl.textContent = chipLabel;
          blankBtnEl.classList.add("correct");
          blankBtnEl.disabled = true;
          chipEl.classList.add("used");
          chipEl.disabled = true;
          filledCount++;
          if (filledCount >= totalBlanks){
            lockQuestion("correct", q.explain, "correct");
            showTablePopup(q.popupText || "Übernimm diese Tabelle schriftlich in dein Heft.");
          }
        } else {
          flashWrong(blankBtnEl);
          flashWrong(chipEl);
          tryAgainFeedback();
        }
      }
      tableEl.querySelectorAll(".tm-blank").forEach(btn=>{
        btn.addEventListener("click", ()=>{
          if (solved || btn.classList.contains("correct")) return;
          const row = Number(btn.dataset.row), slot = Number(btn.dataset.slot);
          if (selection && selection.type === "chip"){
            const chipEl = selection.btn, chipId = selection.chipId, chipLabel = selection.chipLabel;
            clearSelection();
            tryMatch(row, slot, chipId, chipLabel, chipEl, btn);
            return;
          }
          if (selection && selection.type === "blank" && selection.row === row && selection.slot === slot){
            clearSelection();
            return;
          }
          clearSelection();
          selection = { type:"blank", row, slot, btn };
          btn.classList.add("active");
        });
      });
      bankEl.querySelectorAll(".lt-chip").forEach(chip=>{
        chip.addEventListener("click", ()=>{
          if (solved || chip.classList.contains("used")) return;
          const chipId = chip.dataset.chipId, chipLabel = chip.textContent;
          if (selection && selection.type === "blank"){
            const row = selection.row, slot = selection.slot, blankBtnEl = selection.btn;
            clearSelection();
            tryMatch(row, slot, chipId, chipLabel, chip, blankBtnEl);
            return;
          }
          if (selection && selection.type === "chip" && selection.btn === chip){
            clearSelection();
            return;
          }
          clearSelection();
          selection = { type:"chip", chipId, chipLabel, btn: chip };
          chip.classList.add("active");
        });
      });
    } else {
      document.getElementById("opts").querySelectorAll(".option").forEach(btn=>{
        btn.addEventListener("click", ()=>{
          if (solved || btn.classList.contains("disabled")) return;
          attempts++;
          const idx = Number(btn.dataset.idx);
          if (idx === q.correct){
            btn.classList.add("correct");
            document.querySelectorAll("#opts .option").forEach(o=>o.classList.add("disabled"));
            lockQuestion("correct", q.explain, "correct");
          } else {
            btn.classList.add("wrong","disabled");
            tryAgainFeedback();
          }
        });
      });
      const skipBtn = document.getElementById("skipBtn");
      if (skipBtn) skipBtn.addEventListener("click", ()=>{
        if (solved) return;
        const opts = document.querySelectorAll("#opts .option");
        opts.forEach(o=>o.classList.add("disabled"));
        opts[q.correct].classList.add("correct");
        lockQuestion("skipped", "Nicht gelöst.", "wrong");
      });
    }

    document.getElementById("nextBtn").addEventListener("click", goNext);
  }

  function renderResult(){
    fill.style.width = "100%";
    renderNav();
    const correctCount = state.q.filter(r => r.status === "correct").length;
    const rows = set.questions.map((q,idx)=>{
      const r = state.q[idx] || { attempts:0, status:"open" };
      const ok = r.status === "correct";
      return `
        <button type="button" class="result-row" data-idx="${idx}">
          <span class="result-num num">${idx+1}</span>
          <span class="result-label">${esc(q.section || ("Aufgabe " + (idx+1)))}</span>
          <span class="result-attempts num">${r.attempts||0} ${r.attempts===1 ? "Versuch" : "Versuche"}</span>
          <span class="result-status ${ok ? "ok" : "bad"}">${ok ? "✓ Richtig" : "Nicht gelöst"}</span>
        </button>
      `;
    }).join("");
    host.innerHTML = `
      <div class="qcard result">
        <div class="score num">${correctCount}/${total}</div>
        <p>richtig gelöst</p>
      </div>
      <div class="result-table" id="resultTable">${rows}</div>
      <p class="result-hint">Tippe auf eine Aufgabe, um sie dir nochmal anzusehen oder erneut zu versuchen.</p>
      <div style="text-align:center;"><button class="restart-btn" id="restartBtn">Alles zurücksetzen &amp; nochmal üben</button></div>
    `;
    document.getElementById("resultTable").querySelectorAll(".result-row").forEach(row=>{
      row.addEventListener("click", ()=>{
        i = Number(row.dataset.idx);
        renderQuestion();
      });
    });
    document.getElementById("restartBtn").addEventListener("click", ()=>{
      i = 0;
      state.q = freshExerciseState(total).q;
      persist();
      renderQuestion();
    });
  }

  if (state.q.every(x => x.status !== "open")) renderResult(); else renderQuestion();
};

/* ---------- Router ---------- */
function route(){
  const hash = location.hash.replace(/^#/, "") || "/";
  const parts = hash.split("/").filter(Boolean);
  const app = document.getElementById("app");
  let html;
  if (parts.length === 0){
    html = viewHome();
  } else if (parts[0] === "mathe" && parts.length === 1){
    html = viewMathe();
  } else if (parts[0] === "mathe" && parts.length === 2){
    html = viewChapter(parts[1]);
  } else if (parts[0] === "deutsch" && parts.length === 1){
    html = viewDeutsch();
  } else if (parts[0] === "deutsch" && parts.length === 2){
    html = viewDeutschChapter(parts[1]);
  } else if (parts[0] === "gpg" && parts.length === 1){
    html = viewGpg();
  } else if (parts[0] === "gpg" && parts.length === 2){
    html = viewGpgFolder(parts[1]);
  } else if (parts[0] === "gpg" && parts.length === 3){
    html = viewGpgChapter(parts[1], parts[2]);
  } else if (parts[0] === "naturtechnik" && parts.length === 1){
    html = viewNaturtechnik();
  } else if (parts[0] === "naturtechnik" && parts.length === 2){
    html = viewNaturtechnikChapter(parts[1]);
  } else if (parts[0] === "informatik" && parts.length === 1){
    html = viewInformatik();
  } else if (parts[0] === "informatik" && parts.length === 2){
    html = viewInformatikChapter(parts[1]);
  } else if (parts[0] === "wib" && parts.length === 1){
    html = viewWib();
  } else if (parts[0] === "wib" && parts.length === 2){
    html = viewWibChapter(parts[1]);
  } else if (parts[0] === "uebung" && parts.length === 2){
    html = viewExercise(parts[1]);
  } else if (parts[0] === "loesung" && parts.length === 2){
    html = viewSolution(parts[1]);
  } else {
    html = viewNotFound();
  }
  app.innerHTML = html;
  window.scrollTo(0,0);

  if (parts[0] === "uebung" && parts.length === 2 && exerciseSets[parts[1]] && !isLocked(exerciseSets[parts[1]], parts[1])){
    window.__startExercise(parts[1]);
  }
}
/* ---------- Zugangscode-Sperre ----------
   Kein echter Login (technisch nicht möglich, ohne dass jeder Schüler ein eigenes
   Claude-Konto braucht) - nur eine Hürde gegen Zufallsbesucher, die den Link
   irgendwoher haben. Jeder Code funktioniert unbegrenzt oft; das Gerät merkt sich
   nach der ersten erfolgreichen Eingabe, dass es freigeschaltet ist.
   Die gültigen Codes liegen NICHT mehr hier im Quelltext, sondern werden bei der
   Eingabe per Anfrage beim Google-Skript geprüft (Tabellenblatt "Codes") - so sind
   sie nicht mehr einfach über "Seitenquelltext anzeigen" auslesbar. */
const GATE_KEY = "lernportal:unlocked";
const CODE_KEY = "lernportal:code";
/* "Testzugang": ein einzelner, geheimer Code (z.B. der des Lehrers), der serverseitig
   in der Codes-Tabelle mit "Testzugang" = WAHR markiert ist. Damit kann diese Übung
   auf diesem Gerät angesehen/geübt werden, auch wenn sie für die Klasse noch gesperrt
   ist - Schülercodes ohne diese Markierung bleiben ganz normal ausgesperrt. */
const PREVIEW_KEY = "lernportal:preview";
function isUnlocked(){
  try { return localStorage.getItem(GATE_KEY) === "yes"; }
  catch(e){ return false; }
}
function setUnlocked(code){
  try {
    localStorage.setItem(GATE_KEY, "yes");
    localStorage.setItem(CODE_KEY, code);
  } catch(e){ /* ignorieren */ }
}
function getMyCode(){
  try { return localStorage.getItem(CODE_KEY) || ""; }
  catch(e){ return ""; }
}
function hasPreviewAccess(){
  try { return localStorage.getItem(PREVIEW_KEY) === "yes"; }
  catch(e){ return false; }
}
function setPreviewAccess(on){
  try { localStorage.setItem(PREVIEW_KEY, on ? "yes" : "no"); }
  catch(e){ /* ignorieren */ }
}
function normalizeCode(s){ return String(s || "").trim().toUpperCase().replace(/\s+/g,""); }

/* ---------- Anbindung an Google-Auswertung/Freischaltung (optional) ----------
   Solange APPS_SCRIPT_URL leer ist, passiert hier gar nichts - das Lernportal
   funktioniert exakt wie zuvor (Freischaltung nur über das fest im Code
   hinterlegte "locked"-Flag). Erst wenn eine echte Web-App-Adresse eingetragen
   ist, werden Ergebnisse gemeldet und Freischaltungen von dort abgefragt. */
const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyFxZtY6ojF8zAvrBwuuPBA2Q6sWtbEIARR5YqJj-g1PGjcX_gFfJYDbO01AOnPSJFj/exec";
let remoteLocksCache = null;
const REMOTE_LOCKS_CACHE_KEY = "lernportal:remoteLocks";
(function loadCachedRemoteLocks(){
  try {
    const raw = localStorage.getItem(REMOTE_LOCKS_CACHE_KEY);
    if (raw) remoteLocksCache = JSON.parse(raw).data || null;
  } catch(e){ /* ignorieren */ }
})();

function fetchRemoteLocks(){
  if (!APPS_SCRIPT_URL) return;
  const cbName = "__locksCb" + Date.now();
  let done = false;
  const script = document.createElement("script");
  function cleanup(){ try { delete window[cbName]; } catch(e){} if (script.parentNode) script.parentNode.removeChild(script); }
  window[cbName] = function(data){
    if (done) return;
    done = true;
    remoteLocksCache = data;
    try { localStorage.setItem(REMOTE_LOCKS_CACHE_KEY, JSON.stringify({ at: Date.now(), data })); } catch(e){ /* ignorieren */ }
    cleanup();
  };
  script.src = APPS_SCRIPT_URL + "?action=locks&callback=" + cbName;
  script.onerror = function(){ done = true; cleanup(); };
  document.body.appendChild(script);
  setTimeout(function(){ if (!done){ done = true; cleanup(); } }, 4000);
}

/* Holt den serverseitig gespeicherten Fortschritt zu einem Code und ergänzt damit
   Lücken im lokal gespeicherten Fortschritt (state im localStorage). So geht der
   Fortschritt nicht verloren, wenn der Browser/das Gerät seinen lokalen Speicher
   vergisst (kommt z.B. bei manchen mobilen Browsern oder "Zum Home-Bildschirm
   hinzufügen"-Apps vor) - nach erneuter Code-Eingabe wird der letzte bekannte
   Stand pro Aufgabe automatisch wiederhergestellt. */
function fetchRemoteProgress(code, cb){
  if (!APPS_SCRIPT_URL || !code) return;
  const cbName = "__progressCb" + Date.now();
  let done = false;
  const script = document.createElement("script");
  function cleanup(){ try { delete window[cbName]; } catch(e){} if (script.parentNode) script.parentNode.removeChild(script); }
  window[cbName] = function(data){
    if (done) return;
    done = true;
    cleanup();
    cb(data || {});
  };
  script.src = APPS_SCRIPT_URL + "?action=progress&code=" + encodeURIComponent(code) + "&callback=" + cbName;
  script.onerror = function(){ if (done) return; done = true; cleanup(); };
  document.body.appendChild(script);
  setTimeout(function(){ if (!done){ done = true; cleanup(); } }, 6000);
}

/* Überträgt vom Server geholten Fortschritt in den lokalen Speicher. Überschreibt
   NIE bereits vorhandenen lokalen Fortschritt (der lokale Stand hat immer Vorrang),
   sondern füllt nur noch offene ("open") Aufgaben auf. Gibt true zurück, wenn sich
   dadurch etwas geändert hat (dann lohnt sich ein Neu-Rendern der aktuellen Seite). */
function applyRemoteProgress(progressByExercise){
  let geaendert = false;
  Object.keys(progressByExercise || {}).forEach(function(slug){
    const set = exerciseSets[slug];
    if (!set) return;
    const total = set.questions.length;
    const state = loadExerciseState(slug, total);
    let stateGeaendert = false;
    Object.keys(progressByExercise[slug]).forEach(function(frageStr){
      const idx = Number(frageStr) - 1;
      if (idx < 0 || idx >= total) return;
      if (state.q[idx] && state.q[idx].status !== "open") return; // lokaler Stand hat Vorrang
      const eintrag = progressByExercise[slug][frageStr];
      if (!eintrag || (eintrag.status !== "correct" && eintrag.status !== "skipped")) return;
      state.q[idx] = { status: eintrag.status, attempts: eintrag.attempts || 0 };
      stateGeaendert = true;
    });
    if (stateGeaendert){ saveExerciseState(slug, state); geaendert = true; }
  });
  return geaendert;
}

/* Prüft einen eingegebenen Zugangscode beim Google-Skript (Tabellenblatt "Codes").
   cb(true) = gültig, cb(false) = ungültig, cb(null) = Anfrage fehlgeschlagen/Zeitüberschreitung
   (z.B. keine Internetverbindung) - dann bewusst NICHT freischalten. */
function checkCodeRemote(code, cb){
  if (!APPS_SCRIPT_URL){ cb(false, false); return; }
  const cbName = "__codeCb" + Date.now();
  let done = false;
  const script = document.createElement("script");
  function cleanup(){ try { delete window[cbName]; } catch(e){} if (script.parentNode) script.parentNode.removeChild(script); }
  window[cbName] = function(data){
    if (done) return;
    done = true;
    cleanup();
    cb(!!(data && data.valid), !!(data && data.preview));
  };
  script.src = APPS_SCRIPT_URL + "?action=checkcode&code=" + encodeURIComponent(code) + "&callback=" + cbName;
  script.onerror = function(){ if (done) return; done = true; cleanup(); cb(null, false); };
  document.body.appendChild(script);
  setTimeout(function(){ if (!done){ done = true; cleanup(); cb(null, false); } }, 6000);
}

/* Meldet eine beantwortete Aufgabe (fire-and-forget: Antwort wird bewusst
   nicht gelesen, damit ein langsames/nicht erreichbares Google-Skript die
   Seite für Schüler nie ausbremst oder blockiert). */
function reportResult(exerciseSlug, questionIndex, status, attempts){
  if (!APPS_SCRIPT_URL) return;
  try {
    fetch(APPS_SCRIPT_URL, {
      method: "POST",
      mode: "no-cors",
      keepalive: true, /* Anfrage läuft auch weiter, wenn direkt danach die Seite gewechselt wird */
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({
        type: "result",
        code: getMyCode(),
        exercise: exerciseSlug,
        question: questionIndex,
        status: status,
        attempts: attempts
      })
    }).catch(function(){ /* ignorieren - darf Schüler nie stören */ });
  } catch(e){ /* ignorieren */ }
}

function showApp(){
  document.getElementById("gateOverlay").hidden = true;
  document.getElementById("topbar").style.visibility = "visible";
  document.getElementById("teacherLink").hidden = !hasPreviewAccess();
  fetchRemoteLocks();
  fetchRemoteProgress(getMyCode(), function(data){
    if (applyRemoteProgress(data)) route();
  });
  window.addEventListener("hashchange", route);
  window.addEventListener("DOMContentLoaded", route);
  if (document.readyState !== "loading") route();
}

function initGate(){
  if (isUnlocked()){ showApp(); return; }
  const overlay = document.getElementById("gateOverlay");
  const form = document.getElementById("gateForm");
  const input = document.getElementById("gateInput");
  const error = document.getElementById("gateError");
  const submitBtn = document.getElementById("gateSubmitBtn");
  overlay.hidden = false;
  document.getElementById("topbar").style.visibility = "hidden";
  form.addEventListener("submit", (e)=>{
    e.preventDefault();
    const code = normalizeCode(input.value);
    if (!code || submitBtn.disabled) return;
    error.classList.remove("show");
    submitBtn.disabled = true;
    submitBtn.textContent = "Wird geprüft…";
    checkCodeRemote(code, (valid, preview)=>{
      submitBtn.disabled = false;
      submitBtn.textContent = "Bestätigen";
      if (valid === true){
        setUnlocked(code);
        setPreviewAccess(preview);
        showApp();
      } else if (valid === false){
        error.textContent = "Code nicht erkannt. Bitte nochmal prüfen.";
        error.classList.add("show");
        input.select();
      } else {
        error.textContent = "Verbindung nicht möglich. Bitte Internetverbindung prüfen und nochmal versuchen.";
        error.classList.add("show");
      }
    });
  });
}
initGate();
